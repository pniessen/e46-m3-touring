<text class="t-sm t-b" x="210" y="62">Spot-weld rows along every</text>
<text class="t-sm t-b" x="210" y="76">flange: the RACP seam, both</text>
<text class="t-sm t-b" x="210" y="90">rails and the rear panel</text>
<line class="ln-thin" x1="207" y1="73" x2="176.5" y2="74.6"/>
<text class="t-sm fab-t" x="210" y="116">Drill each one from above with</text>
<text class="t-sm fab-t" x="210" y="130">an 8 mm (5/16 in) spot-weld</text>
<text class="t-sm fab-t" x="210" y="144">cutter, through the flange only</text>
<line class="ln-thin" x1="207" y1="127" x2="178.5" y2="120.3"/>
<text class="t-sm" x="210" y="170">Count each row and measure</text>
<text class="t-sm" x="210" y="184">its pitch before you drill</text>
<text class="t-sm crit-t" x="210" y="210">Keep every flange whole: never</text>
<text class="t-sm crit-t" x="210" y="224">torch-cut, and never cut or</text>
<text class="t-sm crit-t" x="210" y="238">grind through a flange</text>
<line class="ln-thin" x1="207" y1="221" x2="185.5" y2="214.3"/>
<line class="ln-faint" x1="8" y1="250" x2="392" y2="250"/>
<text class="t-h" x="8" y="268">2  OUT DOWNWARD, IN FROM BELOW</text>
<text class="t-xs" x="8" y="284">Section across one rail, schematic</text>
<text class="t-sm t-b" x="8" y="308">a</text>
<rect class="keep" x="14" y="330" width="30" height="44" stroke-width="1.2"/>
<rect class="keep" x="44" y="330" width="22" height="4" stroke-width="1"/>
<rect class="keep" x="74" y="330" width="26" height="4" stroke-width="1"/>
<path class="fab-s dash" d="M46,336 H112 C126,336 126,370 140,370 H190" stroke-width="2.5"/>
<line class="fab-s" x1="70" y1="304" x2="70" y2="327" stroke-width="2" marker-end="url(#ahf)"/>
<line class="fab-s" x1="118" y1="360" x2="103" y2="338" stroke-width="2" marker-end="url(#ahf)"/>
<line class="ln" x1="164" y1="376" x2="164" y2="400" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="t-xs fab-t" x="78" y="304">8 mm cutter,</text>
<text class="t-xs fab-t" x="78" y="316.5">flange only</text>
<text class="t-xs fab-t" x="100" y="354" text-anchor="end">chisel</text>
<text class="t-xs fab-t" x="100" y="366.5" text-anchor="end">from below</text>
<text class="t-xs" x="170" y="396">drops out</text>
<text class="t-sm t-b" x="204" y="308">b</text>
<rect class="keep" x="214" y="330" width="30" height="44" stroke-width="1.2"/>
<rect class="keep" x="244" y="330" width="22" height="4" stroke-width="1"/>
<rect class="keep" x="274" y="330" width="26" height="4" stroke-width="1"/>
<path class="new-s" d="M246,336 H390" stroke-width="3"/>
<path class="fab" d="M265,334.5 V330 Q270,324 275,330 V334.5 Z" stroke-width="1"/>
<line class="fab-s" x1="270" y1="304" x2="270" y2="321" stroke-width="2" marker-end="url(#ahf)"/>
<line class="new-s" x1="354" y1="370" x2="354" y2="342" stroke-width="2" marker-end="url(#ahn)"/>
<text class="t-xs fab-t" x="278" y="304">plug-weld down-</text>
<text class="t-xs fab-t" x="278" y="316.5">hand from above</text>
<text class="t-xs new-t" x="360" y="362">up from</text>
<text class="t-xs new-t" x="360" y="374.5">below</text>
<text class="t-xs" x="8" y="416">Drill every weld from above, split the</text>
<text class="t-xs" x="8" y="428.5">layers from below with a spot-weld</text>
<text class="t-xs" x="8" y="441">chisel, and the well drops out.</text>
<text class="t-xs" x="204" y="416">Offer the new floor up, cleco or clamp</text>
<text class="t-xs" x="204" y="428.5">it at every hole, then plug-weld through</text>
<text class="t-xs" x="204" y="441">the same holes into the floor beneath.</text>
<line class="ln-faint" x1="8" y1="458" x2="392" y2="458"/>
<text class="t-h" x="8" y="476">3  EACH FLANGE JOINT</text>
<text class="t-xs" x="8" y="492">Enlarged section; sheet thickness: measure yours</text>
<rect class="keep" x="40" y="554" width="140" height="5" stroke-width="1"/>
<rect class="keep" x="212" y="554" width="88" height="5" stroke-width="1"/>
<rect class="new" x="88" y="560.5" width="300" height="5" stroke-width="1"/>
<line class="ln dash" x1="90" y1="559.8" x2="168" y2="559.8" stroke-width="1"/>
<line class="ln dash" x1="224" y1="559.8" x2="298" y2="559.8" stroke-width="1"/>
<path class="fab" d="M172.0,554 Q196,534.8 220.0,554 L212.0,554 L212.0,565.5 Q196,571.5 180.0,565.5 L180.0,554 Z" stroke-width="1.2"/>
<path class="fill-fg" d="M300,554 Q309,560 313,560.5 L300,560.5 Z"/>
<path class="fill-fg" d="M88,560.5 L88,565.5 Q79,560.5 75,560.5 Z"/>
<line class="ln" x1="172" y1="538" x2="220" y2="538" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="t-xs t-b" x="196" y="514" text-anchor="middle">face 10–13 mm,</text>
<text class="t-xs t-b" x="196" y="526.5" text-anchor="middle">no more than 3 mm high</text>
<line class="ln" x1="180" y1="586" x2="212" y2="586" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line class="ln-thin" x1="180" y1="568" x2="180" y2="590"/>
<line class="ln-thin" x1="212" y1="568" x2="212" y2="590"/>
<text class="t-xs t-b" x="196" y="600" text-anchor="middle">8 mm (5/16 in) hole</text>
<text class="t-xs" x="8" y="514">Touring flange: rail,</text>
<text class="t-xs" x="8" y="526.5">RACP or rear panel</text>
<line class="ln-thin" x1="60" y1="530" x2="64" y2="553"/>
<text class="t-xs new-t" x="392" y="588" text-anchor="end">new floor edge</text>
<line class="ln-thin" x1="352" y1="578" x2="352" y2="561"/>
<text class="t-xs" x="8" y="588">seam sealer,</text>
<text class="t-xs" x="8" y="600.5">underside</text>
<line class="ln-thin" x1="36" y1="578" x2="81" y2="566"/>
<text class="t-xs" x="392" y="514" text-anchor="end">seam sealer,</text>
<text class="t-xs" x="392" y="526.5" text-anchor="end">cargo side</text>
<line class="ln-thin" x1="340" y1="530" x2="306" y2="556"/>
<text class="t-xs" x="8" y="622">Dashed: weld-through primer on the mating faces, kept out of the weld spot.</text>
<text class="t-xs" x="8" y="634.5">Layers touching at every hole: gap 1 mm or less. Paint off about 30 mm</text>
<text class="t-xs" x="8" y="647">round each weld, both faces; grind off the zinc where you weld.</text>
<rect class="keep" x="40" y="660" width="320" height="18" stroke-width="1"/>
<circle class="fab" cx="70" cy="669" r="6" stroke-width="1.2"/>
<circle class="fab" cx="150" cy="669" r="6" stroke-width="1.2"/>
<circle class="fab" cx="230" cy="669" r="6" stroke-width="1.2"/>
<circle class="fab" cx="310" cy="669" r="6" stroke-width="1.2"/>
<line class="ln" x1="150" y1="688" x2="230" y2="688" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="t-xs t-b" x="190" y="702" text-anchor="middle">at least 25 mm (1 in) apart</text>
<text class="t-xs" x="8" y="716">Same count and positions as the factory spot welds; skip round the four</text>
<text class="t-xs" x="8" y="728.5">edges so no area gets hot.</text>
<line class="ln-faint" x1="8" y1="740" x2="392" y2="740"/>
<text class="t-h" x="8" y="758">4  NO FLANGE: A JOGGLED LAP</text>
<text class="t-xs" x="8" y="774">Partial graft or flat panel; enlarged section</text>
<rect class="keep" x="20" y="816" width="194" height="5" stroke-width="1"/>
<path class="fab" d="M160,822.5 H224 L230,816 H380 V821 H232 L226,827.5 H160 Z" stroke-width="1"/>
<path class="fab" d="M172,816 Q185.0,807 194,816 L189,816 L189,821 L177,821 L177,816 Z" stroke-width="1"/>
<path class="fill-fg" d="M214,816 Q218,815 221,812 L223,816 Z"/>
<path class="fill-fg" d="M160,822.5 L160,827.5 Q154,827.5 150,831 Z"/>
<line class="ln" x1="160" y1="842" x2="214" y2="842" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line class="ln-thin" x1="160" y1="830" x2="160" y2="846"/>
<line class="ln-thin" x1="214" y1="823" x2="214" y2="846"/>
<text class="t-xs t-b" x="187" y="856" text-anchor="middle">lap about 12–15 mm</text>
<text class="t-xs" x="8" y="792">panel you keep</text>
<line class="ln-thin" x1="50" y1="796" x2="70" y2="815"/>
<text class="t-xs fab-t" x="250" y="790">joggled edge: steps</text>
<line class="ln-thin" x1="247" y1="787.3" x2="228" y2="820"/>
<text class="t-xs fab-t" x="250" y="802.5">down one thickness</text>
<text class="t-xs fab-t" x="8" y="856">8 mm plug welds</text>
<text class="t-xs fab-t" x="8" y="868.5">in the top layer</text>
<line class="ln-thin" x1="92" y1="850" x2="180" y2="814"/>
<rect class="keep" x="40" y="882" width="320" height="16" stroke-width="1"/>
<circle class="fab" cx="70" cy="890" r="5" stroke-width="1.2"/>
<circle class="fab" cx="150" cy="890" r="5" stroke-width="1.2"/>
<circle class="fab" cx="230" cy="890" r="5" stroke-width="1.2"/>
<circle class="fab" cx="310" cy="890" r="5" stroke-width="1.2"/>
<line class="fab-s" x1="98" y1="898" x2="124" y2="898" stroke-width="3"/>
<line class="fab-s" x1="178" y1="898" x2="204" y2="898" stroke-width="3"/>
<line class="fab-s" x1="258" y1="898" x2="284" y2="898" stroke-width="3"/>
<line class="ln" x1="70" y1="908" x2="150" y2="908" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="t-xs t-b" x="110" y="922" text-anchor="middle">25–40 mm pitch</text>
<text class="t-xs fab-t" x="392" y="922" text-anchor="end">short stitches</text>
<line class="ln-thin" x1="318" y1="912" x2="286" y2="899"/>
<text class="t-xs" x="8" y="942">Seal the lap on both faces: laps trap water.</text>
<line class="ln-faint" x1="8" y1="950" x2="392" y2="950"/>
<rect class="keep" x="8" y="962" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="972.5">Your Touring's body, kept</text>
<rect class="new" x="206" y="962" width="12" height="12" rx="2"/>
<text class="t-sm" x="224" y="972.5">New M3 floor</text>
<rect class="fab" x="8" y="980" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="990.5">Drill, weld or modify</text>
<rect class="fab-s dash" x="206" y="980" width="12" height="12" rx="2" stroke-width="1.6"/>
<text class="t-sm" x="224" y="990.5">Comes out</text>
</svg>
