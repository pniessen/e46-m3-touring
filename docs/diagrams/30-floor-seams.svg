<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1002" role="img" aria-label="How the Touring's floor comes out and the M3 floor goes in, in four parts. One: seen from the cargo side, the floor panel and its spare-wheel well are spot-welded under three sets of body flanges, the RACP seam across the front, both rails and the rear panel; you drill every spot weld from above with an 8 mm (5/16 in) cutter through the flange only, after counting each row and measuring its pitch, and you never cut or grind through a flange. Two: you split the layers from below with a spot-weld chisel and the well drops out downward; the new floor goes up from below, clamped or clecoed at every hole, and you plug-weld it down-hand from above through the same holes. Three: at each flange joint the 8 mm hole in the Touring's flange is filled with a plug weld whose face is 10 to 13 mm across and no more than 3 mm high, at the factory spot-weld positions and at least 25 mm (1 in) apart; the layers touch, with a gap of 1 mm or less; paint comes off about 30 mm round each weld on both faces, weld-through primer goes between the layers but not in the weld spot, and seam sealer goes on both faces. Four: where a joint has no flange, on a partial graft or a flat panel, one edge is joggled and the panels lap by about 12 to 15 mm, with 8 mm plug welds through the top layer at 25 to 40 mm pitch plus short stitches, sealed on both faces." color="#1b2128">
