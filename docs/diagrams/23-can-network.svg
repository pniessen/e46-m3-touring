<rect class="shape" x="48" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="60" y="244.5" text-anchor="middle">37</text>
<line class="ln-thin" x1="60" y1="117" x2="60" y2="176"/>
<line class="ln-thin" x1="60" y1="204" x2="60" y2="231"/>
<rect class="shape dash" x="55" y="176" width="10" height="28" rx="1" stroke-width="1.3"/>
<text class="t t-b" x="76" y="126">M3 DME</text>
<text class="t-sm" x="76" y="142">MSS54 / HP</text>
<text class="t-sm t-mono t-b" x="76" y="158">X60004</text>
<text class="t-sm" x="72" y="194">120 Ω ?</text>
<rect class="shape" x="148" y="207" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="160" y="220.5" text-anchor="middle">32</text>
<text class="t-sm t-mono" x="146" y="220" text-anchor="end">TXD II</text>

<!-- Diagnosis socket X19527: no CAN cavities -->
<rect class="keep" x="204" y="108" width="88" height="132" rx="5" stroke-width="1.5"/>
<rect class="shape" x="192" y="207" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="204" y="220.5" text-anchor="middle">7</text>
<rect class="shape" x="280" y="207" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="292" y="220.5" text-anchor="middle">8</text>
<rect class="fill-bg" x="236" y="99" width="24" height="18" rx="2" stroke-width="0"/>
<rect class="crit-s dash" x="236" y="99" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono crit-t" x="248" y="112.5" text-anchor="middle">6</text>
<rect class="fill-bg" x="236" y="231" width="24" height="18" rx="2" stroke-width="0"/>
<rect class="crit-s dash" x="236" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono crit-t" x="248" y="244.5" text-anchor="middle">14</text>
<text class="t-sm crit-t" x="264" y="96">no terminal</text>
<text class="t-sm crit-t" x="264" y="258">no terminal</text>
<text class="t t-b" x="248" y="138" text-anchor="middle">Diagnosis</text>
<text class="t t-b" x="248" y="153" text-anchor="middle">socket</text>
<text class="t-sm t-mono t-b" x="248" y="169" text-anchor="middle">X19527</text>
<text class="t-sm t-b crit-t" x="248" y="200" text-anchor="middle">no CAN</text>
<line class="keep-s" x1="172" y1="216" x2="192" y2="216" stroke-width="2"/>

<!-- Cluster: the gateway -->
<rect class="donor" x="336" y="108" width="134" height="132" rx="5" stroke-width="1.5"/>
<rect class="shape" x="434" y="99" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="446" y="112.5" text-anchor="middle">9</text>
<rect class="shape" x="434" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="446" y="244.5" text-anchor="middle">10</text>
<line class="ln-thin" x1="446" y1="117" x2="446" y2="176"/>
<line class="ln-thin" x1="446" y1="204" x2="446" y2="231"/>
<rect class="shape dash" x="441" y="176" width="10" height="28" rx="1" stroke-width="1.3"/>
<text class="t t-b" x="354" y="126">M3 cluster</text>
<text class="t-sm t-mono t-b" x="354" y="142">X11175</text>
<text class="t-sm" x="354" y="158">gateway</text>
<text class="t-sm" x="434" y="194" text-anchor="end">120 Ω ?</text>
<rect class="shape" x="324" y="207" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="336" y="220.5" text-anchor="middle">25</text>
<text class="t-sm" x="352" y="220">D-bus</text>
<line class="keep-s" x1="304" y1="216" x2="324" y2="216" stroke-width="2"/>
<rect class="shape" x="398" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="410" y="244.5" text-anchor="middle">14</text>
<text class="t-sm" x="410" y="225" text-anchor="middle">K-bus</text>

<!-- DSC unit (MK60) -->
<rect class="keep" x="496" y="108" width="124" height="132" rx="5" stroke-width="1.5"/>
<rect class="shape" x="504" y="99" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="516" y="112.5" text-anchor="middle">11</text>
<rect class="shape" x="504" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="516" y="244.5" text-anchor="middle">15</text>
<line class="ln-thin" x1="516" y1="117" x2="516" y2="176"/>
<line class="ln-thin" x1="516" y1="204" x2="516" y2="231"/>
<rect class="shape" x="511" y="176" width="10" height="28" rx="1" stroke-width="1.3"/>
<text class="t t-b" x="532" y="126">DSC unit</text>
<text class="t-sm" x="532" y="142">MK60: <tspan class="t-mono">11</tspan> / <tspan class="t-mono">15</tspan></text>
<text class="t-sm t-b" x="532" y="194">120 Ω</text>

<!-- Steering-angle sensor -->
<rect class="keep" x="644" y="108" width="148" height="132" rx="5" stroke-width="1.5"/>
<rect class="shape" x="652" y="99" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="664" y="112.5" text-anchor="middle">3</text>
<rect class="shape" x="652" y="231" width="24" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="664" y="244.5" text-anchor="middle">4</text>
<text class="t t-b" x="680" y="126">Steering-angle</text>
<text class="t t-b" x="680" y="141">sensor</text>

<!-- Where to measure: back-probe at the DME, battery disconnected -->
<rect class="panel" x="8" y="296" width="324" height="252" rx="6" stroke-width="1"/>
<path class="ln-thin" d="M30,314 V90 H58" stroke-width="1.5" marker-end="url(#ah)"/>
<path class="ln-thin" d="M50,314 V256 H58" stroke-width="1.5" marker-end="url(#ah)"/>
<circle class="shape" cx="40" cy="328" r="17"/>
<text class="t t-b" x="40" y="333" text-anchor="middle">Ω</text>
<text class="t-sm" x="70" y="316">Back-probe <tspan class="t-mono">X60004</tspan> <tspan class="t-mono">36</tspan> and <tspan class="t-mono">37</tspan> at the</text>
<text class="t-sm" x="70" y="330">plugged-in DME, or <tspan class="t-mono">X11175</tspan> <tspan class="t-mono">9</tspan> and <tspan class="t-mono">10</tspan> at</text>
<text class="t-sm" x="70" y="344">the cluster. Battery disconnected, every</text>
<text class="t-sm" x="70" y="358">module plugged in.</text>
<text class="t-sm t-b crit-t" x="18" y="384">Not at the diagnosis socket: no CAN there.</text>
<text class="t-sm t-b" x="18" y="406">Reading</text>
<text class="t-sm t-b" x="112" y="406">Means</text>
<line class="ln-faint" x1="18" y1="412" x2="322" y2="412"/>
<text class="t-sm t-b" x="18" y="428">about 60 Ω</text>
<text class="t-sm t-b" x="112" y="428">pass: both terminators in place</text>
<text class="t-sm" x="18" y="444">about 120 Ω</text>
<text class="t-sm" x="112" y="444">a terminating module unplugged or cut off</text>
<text class="t-sm" x="18" y="460">about 40 Ω</text>
<text class="t-sm" x="112" y="460">a third terminator</text>
<text class="t-sm" x="18" y="476">0 Ω</text>
<text class="t-sm" x="112" y="476">high and low shorted together</text>
<text class="t-sm" x="18" y="492">open</text>
<text class="t-sm" x="112" y="492">both missing, or the probe wire broken</text>
<line class="ln-faint" x1="18" y1="506" x2="322" y2="506"/>
<text class="t-sm" x="18" y="522">Key on: each line about 2.5 V to ground (2.35–2.65 V).</text>
<text class="t-sm" x="18" y="536">Unplug one module at a time: about 120 Ω = a terminator.</text>

<!-- K-bus: one wire from the cluster to the body modules -->
<path class="keep-s" d="M410,249 V260 A6,6 0 0 1 410,272 V312" stroke-width="2"/>
<rect class="keep" x="344" y="312" width="212" height="138" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="354" y="331">K-bus</text>
<text class="t-sm" x="354" y="347">one wire, <tspan class="t-mono">WS/RT/GE</tspan>, about 12 V</text>
<text class="t-sm" x="354" y="368">light module, body module, climate</text>
<text class="t-sm" x="354" y="382">control, airbag unit, EWS, switch</text>
<text class="t-sm" x="354" y="396">center (<tspan class="t-mono">X1869</tspan> pin <tspan class="t-mono">23</tspan>), steering-wheel</text>
<text class="t-sm" x="354" y="410">audio buttons, park distance control</text>
<text class="t-sm" x="354" y="424">and others</text>
<text class="t-sm" x="344" y="470">DME faults for a missing partner:</text>
<text class="t-sm" x="344" y="484"><tspan class="t-mono">132 (0x84)</tspan> DSC, <tspan class="t-mono">133 (0x85)</tspan></text>
<text class="t-sm" x="344" y="498">steering-angle sensor, <tspan class="t-mono">134 (0x86)</tspan></text>
<text class="t-sm" x="344" y="512">cluster, <tspan class="t-mono">86 (0x56)</tspan> its own CAN.</text>

<!-- What crosses the cluster's gateway in this swap -->
<rect class="keep" x="566" y="312" width="226" height="182" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="576" y="331">Through the cluster's gateway</text>
<text class="t-sm" x="576" y="350">A/C request (climate control)</text>
<text class="t-sm" x="576" y="364">and crash signal (airbag unit):</text>
<text class="t-sm" x="576" y="378">K-bus → cluster → CAN → DME</text>
<text class="t-sm" x="576" y="392">Tank level: cluster → CAN → DME</text>
<text class="t-sm t-b" x="576" y="414">If the cluster isn't talking on both</text>
<text class="t-sm t-b" x="576" y="428">buses: no A/C, no crash cut-off and</text>
<text class="t-sm t-b" x="576" y="442">no leak test</text>
<text class="t-sm" x="576" y="456">(our reading of BMW's descriptions).</text>
<text class="t-sm" x="576" y="470">Even with a working cluster, the crash</text>
<text class="t-sm" x="576" y="484">cut-off is unverified with the K96 relay.</text>

<!-- Footnotes -->
<text class="t-sm" x="344" y="534">The DSC unit's yaw sensor has a separate CAN of its own, not shown.</text>
<text class="t-sm" x="344" y="548">An MK20 DSC unit (not used in this build) has CAN on pins 17 and 16.</text>
<text class="t-sm" x="344" y="562">An ex-automatic Touring's gearbox-unit stub stays unplugged.</text>
</svg>
