<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 572" role="img" aria-label="Network diagram of the powertrain CAN, the K-bus and the diagnosis socket after the swap. CAN high (GE/RT) runs along splice X1893 and CAN low (GE/BR) along splice X1894; four nodes land on both: the M3 DME at X60004 pins 36 and 37, the M3 cluster at X11175 pins 9 and 10, the DSC unit (MK60) at pins 11 and 15, and the steering-angle sensor at pins 3 and 4. The DSC unit holds one 120 ohm terminator and the cluster or the DME the other, which one isn't documented, so a healthy bus reads about 60 ohms. Measure with the battery disconnected and every module plugged in, back-probing X60004 pins 36 and 37 at the DME or X11175 pins 9 and 10 at the cluster, not at the diagnosis socket. Readings between high and low: about 60 ohms passes; about 120 ohms means a terminating module is unplugged or cut off; about 40 ohms a third terminator; 0 ohms high and low shorted together; open means both terminators are missing or the probe wire is broken. Key on, each line sits at about 2.5 volts to ground (2.35 to 2.65). Unplugging one module at a time shows which ones terminate. The diagnosis socket X19527 has no terminals at pins 6 and 14, so no CAN; its pin 7 goes to the DME's TXD II line at X60004 pin 32 and its pin 8 to the cluster's D-bus at X11175 pin 25. The K-bus is one WS/RT/GE wire at about 12 volts from cluster pin 14 to the light module, body module, climate control, airbag unit, EWS, switch center (X1869 pin 23), steering-wheel audio buttons, park distance control and others. The A/C request from the climate control and the crash signal from the airbag unit go over the K-bus to the cluster and on over CAN to the DME, and so does the cluster's tank level. By the manual's reading of BMW's descriptions, a cluster that isn't talking on both buses costs the A/C, the crash cut-off and the leak test; and even with a working cluster, the crash cut-off is unverified with the K96 relay. The DME logs 132 (0x84) for the DSC unit, 133 (0x85) for the steering-angle sensor, 134 (0x86) for the cluster and 86 (0x56) for its own CAN. The DSC unit's yaw sensor has a separate CAN, an MK20 DSC unit, not used in this build, has CAN on pins 17 and 16, and an ex-automatic Touring's gearbox-unit stub stays unplugged." color="#1b2128">
