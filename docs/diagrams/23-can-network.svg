<line class="keep-s" x1="516" y1="249" x2="516" y2="266" stroke-width="2"/>
<circle class="keep-f" cx="516" cy="82" r="4"/>
<circle class="keep-f" cx="516" cy="266" r="4"/>
<line class="keep-s" x1="664" y1="82" x2="664" y2="99" stroke-width="2"/>
<line class="keep-s" x1="664" y1="249" x2="664" y2="266" stroke-width="2"/>
<circle class="keep-f" cx="664" cy="82" r="4"/>
<circle class="keep-f" cx="664" cy="266" r="4"/>
<text class="t-sm t-b" x="92" y="74">CAN high, <tspan class="t-mono">GE/RT</tspan>: splice <tspan class="t-mono">X1893</tspan></text>
<text class="t-sm t-b" x="92" y="284">CAN low, <tspan class="t-mono">GE/BR</tspan>: splice <tspan class="t-mono">X1894</tspan></text>

<!-- DME -->
<rect class="donor" x="40" y="108" width="120" height="132" rx="5" stroke-width="1.5"/>
<rect class="shape" x="48" y="99" width="24" height="18" rx="2" stroke-width="1.2"/>
