</defs>
<rect class="bg" x="0" y="0" width="800" height="572" fill="#ffffff"/>
<text class="t-h" x="8" y="24">CAN, K-BUS AND DIAGNOSIS SOCKET</text>
<text class="t-sm" x="702.1" y="22">120 Ω terminator</text>
