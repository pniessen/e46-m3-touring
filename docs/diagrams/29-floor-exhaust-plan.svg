<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" role="img" aria-label="Plan view of the Touring's rear floor from below, front at the top, so the car's left is on the right of the drawing. Positions are approximate, within about 50 to 100 mm, in millimetres from datum O, the midpoint between the bolt centers of the rear subframe's two rear mounts, with X rearward and Y left or right; nobody publishes them, so you record the donor's first. The RACP joins the trunk floor along a seam about 20 mm behind the mounts, and the floor runs back between the two rails to the rear panel at about X 730; the bumper face is at about X 845. Your Touring's 620 mm spare-wheel well, centred about 330 mm behind O, comes out with the whole floor panel, and CMP's 120 mm access strip beside each rail, at the front of the well, lies inside it. The new M3 trunk floor 41127895619 fills the same outline on the same flanges, with reinforcement 51717894229 along its front edge. The M3 muffler 18107831783, 26.7 kg, spans about X 380 to 720 and nearly the full width, under its heat shield 51482494848, with its twin inlets at the front left and four tips at the bumper. It hangs on three stud plates: H1, front left, 41112497585, already on your Touring; H2, rear left, 41122494844, which replaces your 41118204223; and H3, 41112493931, on the right rail. The M3 pipes run back from the tunnel, under tunnel shield 51487893366, past the left of the M3 diff. Your canister and leak-test pump run fore and aft at the right rear, between the battery box and the well, where the muffler's right end will likely come within 25 mm. With the M3 floor, expect the M3 holder: if the canister is under 25 mm from the muffler or H3, fit holder 16132229735 and cover 51717893604 at the donor's position, across the car just behind the diff; at 25 mm or more, either layout works." color="#1b2128">
