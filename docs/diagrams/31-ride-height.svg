<text class="t" x="352" y="542.4" text-anchor="middle">567</text>
<text class="t-xs" x="18" y="560.9">Normal position: full tank, 68 kg (150 lb) on each front seat, 68 kg in the</text>
<text class="t-xs" x="18" y="573.9">middle of the rear seat, 21 kg (46 lb) in the trunk</text>

<!-- Rim size and tyres -->
<text class="t-xs" x="8" y="602.9">A bigger rim raises BMW's figure about 12.7 mm (0.5 in) per inch with the body</text>
<text class="t-xs" x="8" y="615.9">where it was: BMW's rows step 13–15 mm per inch, and hub-to-lip stays the</text>
<text class="t-xs" x="8" y="628.9">same. M3 tyres also lift the body itself about 14 mm (0.6 in) at the same</text>
<text class="t-xs" x="8" y="641.9">suspension position (our arithmetic).</text>

