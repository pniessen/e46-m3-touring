<text class="t-xs" x="8" y="894.6">Record at that load, before anything changes: BMW's ride height and hub-to-lip</text>
<text class="t-xs" x="8" y="907.6">at each corner, the four jacking points, the roof marks and the door-pillar label.</text>
<text class="t-xs" x="8" y="923.6">After the build, measure the same points the same way. Pass: the roof and every</text>
<text class="t-xs" x="8" y="936.6">jacking point within 50.8 mm (2 in) of Phase 0. Our target: within 25 mm (1 in).</text>

<!-- How BMW measures -->
<rect class="warn-f" x="8" y="952.6" width="384" height="88" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="18" y="969.6">Measure the BMW way</text>
<text class="t-xs" x="18" y="984.6">Level floor; tyres at placard pressure; a metric tape with 1 mm divisions.</text>
<text class="t-xs" x="18" y="1000.6">Load the car as its table says. Bounce each corner and roll the car a few</text>
<text class="t-xs" x="18" y="1013.6">feet before you read.</text>
<text class="t-xs" x="18" y="1029.6">Short of a full tank, add 3.2 kg (7 lb) in the cargo area for each US gallon.</text>
