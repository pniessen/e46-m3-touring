<text class="t-h" x="8" y="675.9">MASSACHUSETTS BASELINE</text>
<text class="t-xs" x="8" y="689.9">your Touring in Phase 0, before the swap, loaded to its normal position</text>
<text class="t-xs t-b" x="200" y="709.9" text-anchor="middle">Roof marks, front and rear: measure each from the floor</text>
<text class="t-xs" x="200" y="722.9" text-anchor="middle">BMW: 1,409 mm (55.5 in); 1,444 mm (56.8 in) with roof rails</text>
