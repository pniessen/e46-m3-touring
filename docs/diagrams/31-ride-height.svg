<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1048" role="img" aria-label="BMW's ride height and the Massachusetts baseline. One wheel in side view, the same at every corner: BMW's ride height is measured with a metric tape from the rim flange, at the bottom middle, to the lower edge of the wheel arch; hub-to-lip runs from the hub centre to the same arch edge and doesn't depend on the rim. BMW's figures from TIS, rim flange to arch edge, are plus or minus 10 mm, with left and right within 10 mm of each other, and are measured in normal position, a load. E46 M3: front 605 mm and rear 587 mm on 18-inch wheels, 619 and 600 mm on 19-inch wheels, with a full tank, 68 kg on each front seat and 14 kg in the middle of the trunk. 325i Touring, front and rear, standard suspension: 576 and 542 mm on 15-inch wheels, 589 and 555 on 16-inch, 604 and 570 on 17-inch, 617 and 583 on 18-inch; sport suspension: 561 and 526, 574 and 539, 589 and 554, 602 and 567 mm; with a full tank, 68 kg on each front seat, 68 kg in the middle of the rear seat and 21 kg in the trunk. A bigger rim raises BMW's figure by about 12.7 mm per inch with the body where it was, and BMW's rows step 13–15 mm per inch, while hub-to-lip doesn't change; M3 tyres lift the body about 14 mm at the same suspension position. Massachusetts baseline, a side view of your Touring in Phase 0 before the swap, loaded to its normal position: record BMW's ride height and hub-to-lip at each corner, the height of the four jacking points, two each side, and the roof at marks front and rear, each from the floor. BMW publishes the roof height as 1,409 mm (55.5 in), or 1,444 mm (56.8 in) with roof rails. After the build, measure the same points the same way: the roof and every jacking point must be within 50.8 mm (2 in) of Phase 0, and our target is 25 mm (1 in). Measure on a level floor with the tyres at placard pressure, bounce each corner and roll the car first, and add 3.2 kg (7 lb) in the cargo area for each US gallon short of a full tank." color="#1b2128">
