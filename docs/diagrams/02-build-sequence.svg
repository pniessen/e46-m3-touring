<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" role="img" aria-label="Build order in two tracks. Your Touring goes through phases 0 and 4 to 13 in three stages: strip and metalwork, mechanical, finish. The bench track (buy and strip the donor, rebuild axles, refresh the S54, flash the DME, graft the fenders) feeds the car at phases 5 and 6, 7 and 8, 9, 11 and 12." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="arr" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
  <marker id="arrd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="donor-f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="720" fill="#ffffff"/>

<text class="t-h" x="8" y="22">BENCH</text>
<text class="t-h" x="228" y="22">YOUR TOURING</text>

<!-- Stage labels (car column) -->
<text class="t-xs t-b" x="228" y="46">STAGE 1 · METALWORK</text>
<text class="t-xs t-b" x="228" y="302">STAGE 2 · MECHANICAL</text>
<text class="t-xs t-b" x="228" y="654">STAGE 3 · FINISH</text>

<!-- Bench boxes -->
<rect class="donor" x="8" y="54" width="164" height="44" rx="5"/>
<text class="t" x="17" y="72"><tspan class="t-b">1 </tspan>Buy and inspect</text>
<text class="t" x="17" y="89">the donor M3</text>

<rect class="donor" x="8" y="110" width="164" height="44" rx="5"/>
<text class="t" x="17" y="128"><tspan class="t-b">2 </tspan>Strip the donor;</text>
<text class="t" x="17" y="145">cut arch + floor steel</text>

<rect class="donor" x="8" y="166" width="164" height="44" rx="5"/>
<text class="t" x="17" y="184"><tspan class="t-b">3 </tspan>Rebuild both axles:</text>
<text class="t" x="17" y="201">bushings, RTABs, brakes</text>

<rect class="donor" x="8" y="222" width="164" height="60" rx="5"/>
<text class="t" x="17" y="240"><tspan class="t-b">3 </tspan>Refresh the S54:</text>
<text class="t" x="17" y="257">bearings, VANOS,</text>
<text class="t" x="17" y="274">valves, clutch</text>

<rect class="donor" x="8" y="310" width="164" height="44" rx="5"/>
<text class="t" x="17" y="328"><tspan class="t-b">3 </tspan>DME: EWS-delete</text>
<text class="t" x="17" y="345">flash, your VIN</text>

<rect class="donor" x="8" y="366" width="164" height="44" rx="5"/>
<text class="t" x="17" y="384"><tspan class="t-b">3 </tspan>Graft M3 fenders</text>
<text class="t" x="17" y="401">off the car</text>

<line class="ln" x1="90" y1="98" x2="90" y2="109" marker-end="url(#arr)"/>

<!-- Car boxes -->
<rect class="shape" x="228" y="54" width="164" height="44" rx="5"/>
<text class="t" x="237" y="72"><tspan class="t-b">0 </tspan>Baseline: scan,</text>
<text class="t" x="237" y="89">measure, photograph</text>

<rect class="shape" x="228" y="110" width="164" height="44" rx="5"/>
<text class="t" x="237" y="128"><tspan class="t-b">4 </tspan>Strip the Touring;</text>
<text class="t" x="237" y="145">drop tank + filler</text>

<rect class="fab" x="228" y="166" width="164" height="44" rx="5" stroke-width="1.5"/>
<text class="t" x="237" y="184"><tspan class="t-b">5 </tspan>Subframe-mount</text>
<text class="t" x="237" y="201">plates; floor panel</text>

<rect class="fab" x="228" y="222" width="164" height="60" rx="5" stroke-width="1.5"/>
<text class="t" x="237" y="240"><tspan class="t-b">6 </tspan>Mock up axle and</text>
<text class="t" x="237" y="257">wheels; weld arches</text>
<text class="t" x="237" y="274">(doors optional)</text>

<rect class="shape" x="228" y="310" width="164" height="44" rx="5"/>
<text class="t" x="237" y="328"><tspan class="t-b">7 </tspan>Fit M3 rear axle,</text>
<text class="t" x="237" y="345">M3 filter-regulator</text>

<rect class="shape" x="228" y="366" width="164" height="44" rx="5"/>
<text class="t" x="237" y="384"><tspan class="t-b">8 </tspan>Fit M3 front axle</text>
<text class="t" x="237" y="401">and steering</text>

<rect class="shape" x="228" y="422" width="164" height="44" rx="5"/>
<text class="t" x="237" y="440"><tspan class="t-b">9 </tspan>Install S54 + 420G,</text>
<text class="t" x="237" y="457">driveshaft, shifter</text>

<rect class="shape" x="228" y="478" width="164" height="44" rx="5"/>
<text class="t" x="237" y="496"><tspan class="t-b">10 </tspan>Cooling, intake,</text>
<text class="t" x="237" y="513">exhaust</text>

<rect class="shape" x="228" y="534" width="164" height="44" rx="5"/>
<text class="t" x="237" y="552"><tspan class="t-b">11 </tspan>Wiring, EWS-deleted</text>
<text class="t" x="237" y="569">DME, cluster, DSC</text>

<rect class="shape" x="228" y="590" width="164" height="44" rx="5"/>
<text class="t" x="237" y="608"><tspan class="t-b">12 </tspan>M3 front end on;</text>
<text class="t" x="237" y="625">first start, shakedown</text>

<rect class="shape" x="228" y="662" width="164" height="44" rx="5"/>
<text class="t" x="237" y="680"><tspan class="t-b">13 </tspan>Bodywork, paint,</text>
<text class="t" x="237" y="697">trim, inspection</text>

<!-- Car sequence -->
<g class="ln">
  <line x1="380" y1="98" x2="380" y2="109" marker-end="url(#arr)"/>
  <line x1="380" y1="154" x2="380" y2="165" marker-end="url(#arr)"/>
  <line x1="380" y1="210" x2="380" y2="221" marker-end="url(#arr)"/>
  <line x1="380" y1="282" x2="380" y2="309" marker-end="url(#arr)"/>
  <line x1="380" y1="354" x2="380" y2="365" marker-end="url(#arr)"/>
  <line x1="380" y1="410" x2="380" y2="421" marker-end="url(#arr)"/>
  <line x1="380" y1="466" x2="380" y2="477" marker-end="url(#arr)"/>
  <line x1="380" y1="522" x2="380" y2="533" marker-end="url(#arr)"/>
  <line x1="380" y1="578" x2="380" y2="589" marker-end="url(#arr)"/>
  <line x1="380" y1="634" x2="380" y2="661" marker-end="url(#arr)"/>
</g>

<!-- Bench feeds the car (lanes chosen so connectors never cross) -->
<g class="donor-s" stroke-width="1.5">
  <path d="M172,132 H216 V188 H227" marker-end="url(#arrd)"/>
  <path d="M216,188 V252 H227" marker-end="url(#arrd)"/>
  <path d="M172,188 H207 V332 H227" marker-end="url(#arrd)"/>
  <path d="M207,332 V388 H227" marker-end="url(#arrd)"/>
  <path d="M172,252 H198 V444 H227" marker-end="url(#arrd)"/>
  <path d="M172,332 H189 V556 H227" marker-end="url(#arrd)"/>
  <path d="M172,388 H180 V612 H227" marker-end="url(#arrd)"/>
</g>

<!-- Key -->
<rect class="donor" x="8" y="440" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="450.5">Bench work on donor parts</text>
<rect class="fab" x="8" y="460" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="470.5">Welding, all in Stage 1</text>
<rect class="shape" x="8" y="480" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="490.5">Work on your Touring</text>
<line class="donor-s" x1="8" y1="508" x2="22" y2="508" stroke-width="1.5" marker-end="url(#arrd)"/>
<text class="t-sm" x="26" y="512">Part ready, feeds that step</text>
</svg>
