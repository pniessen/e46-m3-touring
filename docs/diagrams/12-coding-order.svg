<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 696" role="img" aria-label="The coding sessions in the manual's order, with their tools. 1: back up the vehicle order, every module's coding and the cluster and light-module memories (NCS Expert, PA-Soft, INPA) in Phase 0. 2: the DME's VIN and EWS work (Tool32 and a vendor), read in Phase 1 with the vendor work in Phase 3. Decision: an EWS delete bought as a service, recommended, or a virginized DME that you sync, which no Touring build has documented working. Then wire and check in Phase 11. 3: the EWS in Tool32, with nothing to code after a delete, or a sync for a virgin DME. 4: the cluster and light module (PA-Soft, NCS Expert); the cluster gets your VIN and true mileage from the light module. 5: the DSC (PA-Soft, NCS Expert, INPA), after the cluster because the DSC checks its VIN against it. Decision: keep your MK60 and initialise it, recommended, or fit the M3's MK60 from a 09/2002-on donor, code M3 values by hand and initialise it. 6: first start with the adaptations cleared (Tool32). Then the wheel alignment, then 7: the steering-angle calibration (INPA or Tool32). 8: vehicle-order changes and body modules, and 9, last: the light module and headlights (NCS Expert)." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="696" fill="#ffffff"/>
<!-- Key -->
<rect class="donor" x="8" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="25" y="16.5">From donor M3</text>
<rect class="keep" x="122" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="139" y="16.5">Keep</text>
<rect class="panel" x="186" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="203" y="16.5">Not coding</text>

<!-- 1: backups -->
<rect class="shape" x="8" y="26" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="42">1  Back up everything</text>
<text class="t-sm t-mono" x="382" y="42" text-anchor="end">NCS Expert, PA-Soft, INPA</text>
<text class="t-xs" x="18" y="56">Phase 0: vehicle order, codings, cluster and light-module memories</text>
<line class="ln" x1="200" y1="64" x2="200" y2="75" marker-end="url(#ah)"/>

<!-- 2: DME, and the immobilizer decision -->
<rect class="shape" x="8" y="76" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="92">2  DME VIN and EWS</text>
<text class="t-sm t-mono" x="382" y="92" text-anchor="end">Tool32, a vendor</text>
<text class="t-xs" x="18" y="106">Read in Phase 1; vendor work in Phase 3</text>
<line class="ln" x1="102" y1="114" x2="102" y2="125" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="114" x2="298" y2="125" marker-end="url(#ah)"/>
<rect class="donor" x="8" y="126" width="188" height="62" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="143">EWS delete</text>
<text class="t-xs t-b" x="18" y="157">recommended</text>
<text class="t-xs" x="18" y="170">bought as a service, with</text>
<text class="t-xs" x="18" y="183">your VIN written in</text>
<rect class="donor" x="204" y="126" width="188" height="62" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="143">Virginized DME</text>
<text class="t-xs" x="214" y="157">a vendor clears it, then</text>
<text class="t-xs" x="214" y="170">you sync it to your EWS</text>
<text class="t-xs crit-t" x="214" y="183">no documented Touring success</text>
<line class="ln" x1="102" y1="188" x2="102" y2="199" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="188" x2="298" y2="199" marker-end="url(#ah)"/>
<rect class="panel" x="8" y="200" width="384" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="217.5">Wire, then check</text>
<text class="t-xs" x="128" y="217.5">Phase 11: re-pin, ohm-check, then power up</text>
<line class="ln" x1="102" y1="226" x2="102" y2="237" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="226" x2="298" y2="237" marker-end="url(#ah)"/>

<!-- 3: EWS, depending on the route -->
<rect class="shape" x="8" y="238" width="188" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="254">3  EWS check</text>
<text class="t-sm t-mono" x="186" y="254" text-anchor="end">Tool32</text>
<text class="t-xs" x="18" y="268">nothing to code after a delete</text>
<rect class="shape" x="204" y="238" width="188" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="254">3  EWS sync</text>
<text class="t-sm t-mono" x="382" y="254" text-anchor="end">Tool32</text>
<text class="t-xs" x="214" y="268">sync the virgin DME to your EWS</text>
<line class="ln" x1="102" y1="276" x2="102" y2="287" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="276" x2="298" y2="287" marker-end="url(#ah)"/>

<!-- 4: cluster, then 5: the DSC and its decision -->
<rect class="shape" x="8" y="288" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="304">4  Cluster and light module</text>
<text class="t-sm t-mono" x="382" y="304" text-anchor="end">PA-Soft, NCS Expert</text>
<text class="t-xs" x="18" y="318">Phase 11: the cluster gets your VIN and true mileage from the light module</text>
<line class="ln" x1="200" y1="326" x2="200" y2="337" marker-end="url(#ah)"/>
<rect class="shape" x="8" y="338" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="354">5  DSC coding and VIN</text>
<text class="t-sm t-mono" x="382" y="354" text-anchor="end">PA-Soft, NCS Expert, INPA</text>
<text class="t-xs" x="18" y="368">Phase 11, after session 4: the DSC checks its VIN against the cluster's</text>
<line class="ln" x1="102" y1="376" x2="102" y2="387" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="376" x2="298" y2="387" marker-end="url(#ah)"/>
<rect class="keep" x="8" y="388" width="188" height="62" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="405">A  Keep your MK60</text>
<text class="t-xs t-b" x="18" y="419">recommended</text>
<text class="t-xs" x="18" y="432">initialise its VIN and</text>
<text class="t-xs" x="18" y="445">steering angle</text>
<rect class="donor" x="204" y="388" width="188" height="62" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="405">B  The M3's MK60</text>
<text class="t-xs t-b" x="214" y="419">09/2002-on donors only</text>
<text class="t-xs" x="214" y="432">write your VIN, code M3 values</text>
<text class="t-xs" x="214" y="445">by hand, then initialise</text>
<line class="ln" x1="102" y1="450" x2="102" y2="461" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="450" x2="298" y2="461" marker-end="url(#ah)"/>

<!-- 6: first start; alignment; 7: steering angle; 8 and 9 -->
<rect class="shape" x="8" y="462" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="478">6  First start, adaptations, throttle check</text>
<text class="t-sm t-mono" x="382" y="478" text-anchor="end">Tool32</text>
<text class="t-xs" x="18" y="492">Phase 12: adaptations cleared, the throttles relearn</text>
<line class="ln" x1="200" y1="500" x2="200" y2="511" marker-end="url(#ah)"/>
<rect class="panel" x="8" y="512" width="384" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="529.5">Wheel alignment</text>
<text class="t-xs" x="128" y="529.5">at the car's loaded ride height</text>
<line class="ln" x1="200" y1="538" x2="200" y2="549" marker-end="url(#ah)"/>
<rect class="shape" x="8" y="550" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="566">7  Steering angle after the alignment</text>
<text class="t-sm t-mono" x="382" y="566" text-anchor="end">INPA or Tool32</text>
<text class="t-xs" x="18" y="580">Phase 12: wheel straight, car level, no brake pressure</text>
<line class="ln" x1="200" y1="588" x2="200" y2="599" marker-end="url(#ah)"/>
<rect class="shape" x="8" y="600" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="616">8  Vehicle-order changes and body modules</text>
<text class="t-sm t-mono" x="382" y="616" text-anchor="end">NCS Expert</text>
<text class="t-xs" x="18" y="630">Phase 12, after session 7, and whenever you change the vehicle order</text>
<line class="ln" x1="200" y1="638" x2="200" y2="649" marker-end="url(#ah)"/>
<rect class="shape" x="8" y="650" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="666">9  Light module and headlights</text>
<text class="t-sm t-mono" x="382" y="666" text-anchor="end">NCS Expert</text>
<text class="t-xs" x="18" y="680">Phase 12, last, with the front end on</text>
</svg>
