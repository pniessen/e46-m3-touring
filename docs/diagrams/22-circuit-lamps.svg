<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" role="img" aria-label="Wiring diagram of the three warning lamps and the start feedback after the swap, the M3 way: each sensor feeds the DME and the DME drives the cluster on plug X11175. Oil-pressure switch, closed below about 0.5 bar, to DME X60003 pin 26; DME X60004 pin 11, 0.35 BR/GN, to cluster pin 13; cluster coding CAN_OELDRUCKSCHALTER = nicht_aktiv. Alternator terminal 61 to X60003 pin 13; X60004 pin 1, 0.35 BL, to cluster pin 2: the cluster powers the lamp and the DME grounds it when not charging; GENERATOR_UEBER_CAN = nicht_aktiv. With a donor built from 03/2004, which WDS draws without X60004 pins 1 and 2, code it aktiv if the charge lamp stays dark at key-on. Oil-level sensor, a pulse-width signal, to X60003 pin 39; X60004 pin 21, 0.5 WS/GN, to cluster pin 17; TOG_UEBER_CAN = nicht_aktiv. Starter to X60003 pin 12; X60004 pin 2, 0.35 SW/GN, through splice X276 to cluster pin 3 and the E-box fan plug, if fitted. Cluster pin 14 is the K-bus, not the oil-pressure lamp; Kassel's chart is wrong there. Key on, engine off, the red oil-pressure, charge and check-engine lamps are lit, and oil and charge go out within seconds of the start. Before the swap an MS43 Touring ran these four wires from body X6011 pins 3, 4, 5 and 6 straight to the cluster, past the DME: you move them into X60004 pins 11, 1, 21 and 2. An MS45.1 Touring sent the lamps over CAN: you add the three lamp wires new, and move the start feedback from X6011 pin 6 to X60004 pin 2 only if pin 6 holds a wire, after the heater wire has left pin 2." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="612" fill="#ffffff"/>

<!-- Key -->
<rect class="donor" x="8" y="7" width="14" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="30" y="17">From donor M3</text>
<rect class="keep" x="126.8" y="7" width="14" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="148.8" y="17">Keep</text>
<line class="ln" x1="193.4" y1="13" x2="215.4" y2="13" stroke-width="2"/>
<text class="t-sm" x="221.4" y="17">Your lamp wire, after the swap</text>
<line class="fab-s" x1="396.1" y1="13" x2="418.1" y2="13" stroke-width="2"/>
<text class="t-sm" x="424.1" y="17">Moved wire</text>
<line class="new-s" x1="501.2" y1="13" x2="523.2" y2="13" stroke-width="2"/>
<text class="t-sm" x="529.2" y="17">New wire</text>
<text class="t-h" x="8" y="48">AFTER THE SWAP: SENSOR → DME → CLUSTER</text>
<text class="t-sm t-b" x="189" y="72" text-anchor="middle">X60003</text>
<text class="t-sm t-b" x="309" y="72" text-anchor="middle">X60004</text>
<text class="t-sm t-b" x="497" y="72" text-anchor="middle">X11175</text>

<!-- DME -->
<rect class="donor" x="202" y="78" width="94" height="248" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="249" y="186" text-anchor="middle">DME</text>
<text class="t-sm" x="249" y="201" text-anchor="middle">MSS54 or</text>
<text class="t-sm" x="249" y="216" text-anchor="middle">MSS54HP,</text>
<text class="t-sm" x="249" y="231" text-anchor="middle">the M3's</text>

<!-- Cluster -->
<rect class="donor" x="510" y="78" width="282" height="248" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="784" y="96" text-anchor="end">M3 cluster</text>

<!-- Oil-pressure lamp (red) -->
<rect class="donor" x="8" y="68.5" width="142" height="63" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="85.5">Oil-pressure switch</text>
<text class="t-sm" x="16" y="100.5">closed below about</text>
<text class="t-sm" x="16" y="115.5">0.5 bar</text>
<line class="donor-s" x1="150" y1="100" x2="175.5" y2="100" stroke-width="1.5"/>
<rect class="donor" x="176" y="91.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="189" y="104.5" text-anchor="middle">26</text>
<rect class="keep" x="296" y="91.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="309" y="104.5" text-anchor="middle">11</text>
<rect class="keep" x="484" y="91.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="497" y="104.5" text-anchor="middle">13</text>
<text class="t t-b" x="520" y="97">Oil-pressure lamp (red)</text>
<text class="t-sm t-mono" x="520" y="113">CAN_OELDRUCKSCHALTER = <tspan class="t-b">nicht_aktiv</tspan></text>
<line class="ln" x1="322.5" y1="100" x2="483.5" y2="100" stroke-width="2"/>
<text class="t-sm t-mono" x="403" y="94" text-anchor="middle">0.35 BR/GN</text>

<!-- Charge lamp -->
<rect class="donor" x="8" y="144" width="142" height="48" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="161">Alternator</text>
<text class="t-sm" x="16" y="176">terminal 61</text>
<line class="donor-s" x1="150" y1="168" x2="175.5" y2="168" stroke-width="1.5"/>
<rect class="donor" x="176" y="159.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="189" y="172.5" text-anchor="middle">13</text>
<rect class="keep" x="296" y="159.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="309" y="172.5" text-anchor="middle">1</text>
<rect class="keep" x="484" y="159.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="497" y="172.5" text-anchor="middle">2</text>
<text class="t t-b" x="520" y="165">Charge lamp</text>
<text class="t-sm t-mono" x="520" y="181">GENERATOR_UEBER_CAN = <tspan class="t-b">nicht_aktiv</tspan></text>
<text class="t-sm" x="520" y="197"><tspan class="t-b">Donor from 03/2004</tspan> (WDS: no X60004</text>
<text class="t-sm" x="520" y="211">pins 1, 2): lamp dark at key-on? Code it <tspan class="t-mono">aktiv</tspan>.</text>
<line class="ln" x1="322.5" y1="168" x2="483.5" y2="168" stroke-width="2"/>
<text class="t-sm t-mono" x="403" y="162" text-anchor="middle">0.35 BL</text>

<!-- Oil-level lamp (yellow) -->
<rect class="donor" x="8" y="212" width="142" height="48" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="229">Oil-level sensor</text>
<text class="t-sm" x="16" y="244">pulse-width signal</text>
<line class="donor-s" x1="150" y1="236" x2="175.5" y2="236" stroke-width="1.5"/>
<rect class="donor" x="176" y="227.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="189" y="240.5" text-anchor="middle">39</text>
<rect class="keep" x="296" y="227.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="309" y="240.5" text-anchor="middle">21</text>
<rect class="keep" x="484" y="227.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="497" y="240.5" text-anchor="middle">17</text>
<text class="t t-b" x="520" y="233">Oil-level lamp (yellow)</text>
<text class="t-sm t-mono" x="520" y="249">TOG_UEBER_CAN = <tspan class="t-b">nicht_aktiv</tspan></text>
<line class="ln" x1="322.5" y1="236" x2="483.5" y2="236" stroke-width="2"/>
<text class="t-sm t-mono" x="403" y="230" text-anchor="middle">0.5 WS/GN</text>

<!-- Start feedback (terminal 30h) -->
<rect class="donor" x="8" y="287.5" width="142" height="33" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="304.5">Starter</text>
<line class="donor-s" x1="150" y1="304" x2="175.5" y2="304" stroke-width="1.5"/>
<rect class="donor" x="176" y="295.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="189" y="308.5" text-anchor="middle">12</text>
<rect class="keep" x="296" y="295.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="309" y="308.5" text-anchor="middle">2</text>
<rect class="keep" x="484" y="295.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="497" y="308.5" text-anchor="middle">3</text>
<text class="t t-b" x="520" y="301">Start feedback (terminal 30h)</text>
<text class="t-sm" x="520" y="317">no coding switch</text>

<!-- Start feedback through splice X276 to cluster pin 3 and the E-box fan plug -->
<line class="ln" x1="322.5" y1="304" x2="420" y2="304" stroke-width="2"/>
<line class="keep-s" x1="420" y1="304" x2="483.5" y2="304" stroke-width="1.5"/>
<line class="keep-s" x1="420" y1="304" x2="420" y2="336" stroke-width="1.5"/>
<circle class="fill-fg" cx="420" cy="304" r="3.6"/>
<text class="t-sm t-mono" x="371.2" y="298" text-anchor="middle">0.35 SW/GN</text>
<text class="t-sm" x="413" y="321" text-anchor="end">splice X276</text>
<rect class="keep" x="350" y="336" width="140" height="24" rx="5" stroke-width="1.5"/>
<text class="t-sm" x="359" y="352">E-box fan plug (if fitted)</text>

<!-- Charge lamp: lit by the cluster, grounded by the DME -->
<text class="t-sm" x="403" y="184" text-anchor="middle">the cluster powers it;</text>
<text class="t-sm" x="403" y="198" text-anchor="middle">the DME grounds it</text>
<text class="t-sm" x="403" y="212" text-anchor="middle">when not charging</text>

<!-- Pin 14 is the K-bus -->
<rect class="crit-s" x="484" y="108.5" width="26" height="17" rx="2"/>
<text class="t t-mono crit-t" x="497" y="121.5" text-anchor="middle">14</text>
<text class="t-sm crit-t" x="478" y="121" text-anchor="end">not 14: that's the K-bus</text>
<text class="t-sm crit-t" x="478" y="135" text-anchor="end">(Kassel's chart is wrong)</text>

<!-- Key-on expectation -->
<rect class="panel" x="510" y="334" width="282" height="50" rx="5"/>
<text class="t-sm" x="520" y="351"><tspan class="t-b">Key on, engine off:</tspan> the red oil-pressure, charge</text>
<text class="t-sm" x="520" y="365">and check-engine lamps are lit. Oil and charge</text>
<text class="t-sm" x="520" y="379">go out within seconds of the start.</text>
<line class="ln-faint" x1="8" y1="396" x2="792" y2="396"/>

<!-- Before: MS43 Touring, X6011 straight to the cluster -->
<text class="t-h" x="8" y="422">BEFORE: MS43 TOURING</text>
<text class="t-sm" x="8" y="440">Body X6011 fed the cluster directly, past the DME.</text>
<text class="t-sm t-b" x="150" y="453" text-anchor="middle">X6011</text>
<text class="t-sm t-b" x="316" y="453" text-anchor="middle">cluster</text>
<text class="t-sm fab-t" x="130" y="472" text-anchor="end">move to X60004 <tspan class="t-b">11</tspan></text>
<rect class="keep" x="137" y="459.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="150" y="472.5" text-anchor="middle">3</text>
<line class="fab-s" x1="163.5" y1="468" x2="302.5" y2="468" stroke-width="2"/>
<text class="t-sm t-mono" x="174" y="463">0.35 BR/GN</text>
<rect class="keep" x="303" y="459.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="316" y="472.5" text-anchor="middle">13</text>
<text class="t-sm fab-t" x="130" y="495" text-anchor="end">move to X60004 <tspan class="t-b">1</tspan></text>
<rect class="keep" x="137" y="482.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="150" y="495.5" text-anchor="middle">4</text>
<line class="fab-s" x1="163.5" y1="491" x2="302.5" y2="491" stroke-width="2"/>
<text class="t-sm t-mono" x="174" y="486">0.35 BL</text>
<rect class="keep" x="303" y="482.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="316" y="495.5" text-anchor="middle">2</text>
<text class="t-sm fab-t" x="130" y="518" text-anchor="end">move to X60004 <tspan class="t-b">21</tspan></text>
<rect class="keep" x="137" y="505.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="150" y="518.5" text-anchor="middle">5</text>
<line class="fab-s" x1="163.5" y1="514" x2="302.5" y2="514" stroke-width="2"/>
<text class="t-sm t-mono" x="174" y="509">0.5 WS/GN</text>
<rect class="keep" x="303" y="505.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="316" y="518.5" text-anchor="middle">17</text>
<text class="t-sm fab-t" x="130" y="541" text-anchor="end">move to X60004 <tspan class="t-b">2</tspan></text>
<rect class="keep" x="137" y="528.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="150" y="541.5" text-anchor="middle">6</text>
<line class="fab-s" x1="163.5" y1="537" x2="282" y2="537" stroke-width="2"/>
<circle class="keep-f" cx="282" cy="537" r="3.6"/>
<line class="keep-s" x1="282" y1="537" x2="302.5" y2="537" stroke-width="1.5"/>
<text class="t-sm" x="282" y="553" text-anchor="middle">X276</text>
<text class="t-sm t-mono" x="174" y="532">0.35 SW/GN</text>
<rect class="keep" x="303" y="528.5" width="26" height="17" rx="2"/>
<text class="t t-mono" x="316" y="541.5" text-anchor="middle">3</text>
<text class="t-sm" x="8" y="577">Each moved wire gets a new X60004-type terminal, or a repair lead.</text>

<!-- Before: MS45.1 Touring, lamps over CAN -->
<line class="ln-faint" x1="400" y1="406" x2="400" y2="604"/>
<text class="t-h" x="412" y="422">BEFORE: MS45.1 TOURING</text>
<text class="t-sm" x="412" y="440">The MS45.1 read the sensors and sent the lamps over CAN.</text>
<rect class="shape" x="412" y="452" width="96" height="30" rx="5" stroke-width="1.5"/>
<text class="t-sm" x="422" y="471.5">MS45.1 DME</text>
<rect class="shape" x="692" y="452" width="100" height="30" rx="5" stroke-width="1.5"/>
<text class="t-sm" x="702" y="471.5">cluster</text>
<line class="keep-s" x1="508" y1="467" x2="692" y2="467" stroke-width="3"/>
<text class="t-sm t-b" x="600" y="461" text-anchor="middle">lamps over CAN</text>
<text class="t-sm" x="792" y="496" text-anchor="end">lamp pins 2, 13, 17 (may be empty)</text>
<line class="new-s" x1="412" y1="514" x2="428" y2="514" stroke-width="2"/>
<text class="t-sm new-t" x="434" y="518">add <tspan class="t-b">X60004 11 → cluster 13</tspan>, new 0.35 BR/GN</text>
<line class="new-s" x1="412" y1="532" x2="428" y2="532" stroke-width="2"/>
<text class="t-sm new-t" x="434" y="536">add <tspan class="t-b">X60004 1 → cluster 2</tspan>, new 0.35 BL</text>
<line class="new-s" x1="412" y1="550" x2="428" y2="550" stroke-width="2"/>
<text class="t-sm new-t" x="434" y="554">add <tspan class="t-b">X60004 21 → cluster 17</tspan>, new 0.5 WS/GN</text>
<line class="fab-s" x1="412" y1="568" x2="428" y2="568" stroke-width="2"/>
<text class="t-sm fab-t" x="434" y="572">move <tspan class="t-b">X6011 6 → X60004 2</tspan> only if pin 6 holds a wire,</text>
<text class="t-sm fab-t" x="434" y="586">after the heater wire has left pin 2</text>
</svg>
