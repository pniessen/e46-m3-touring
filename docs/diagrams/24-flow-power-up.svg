<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" role="img" aria-label="The checks before first power-up, part 1: the meter checks before the battery and the DME are both connected. Each stage has a gate that must pass before you go on, and a stop-and-fix exit; on a fail, fix what the exit names or that step's If it fails. In Phase 11, before you join the E-box plugs, compare both halves of X6011, X6021, X6053/X60531, X6054/X60541 and X64101/X64102: each pair the same circuit or empty on one side; if not, use the M3's X6053 and X6054 sections together and never an M3 half with a Touring half. Then join the plugs. Steps 1 to 14, battery disconnected and all five DME plugs off: every terminal locked and every cavity as the move table says; moved wires open to ground; lamp wires under about 1 ohm (generic); the oil-pressure switch near 0 ohms with the engine stopped; the brake test contact and the start interlock continuous; across the gear switch near 0 ohms in gear and open in neutral; the Sport input open with the button released and near 0 ohms pressed (BMW); the leak-test heater on pin 18 and the pump on 30; pin 10 to K96 pin 4, the M3 harness's X6021 pin 1 open to every K96 terminal, and the K96 coil about 90 ohms (generic); coils about 0.8 ohms each and all alike (BMW); six equal injector readings; temperature sensors about 2,500 ohms at 20 degrees C (generic); and the crankshaft sensor a steady reading, open to ground. Steps 15 to 18, battery connected and the DME still unplugged: battery voltage at X60001 pin 7 and K6300 terminal 30; terminal 15 at X60004 pin 26 above 9 volts at key position 2 (BMW) and 0 volts with the key off; grounds near 0 ohms with under 0.1 volt drop (generic). Step 19, battery disconnected again with the DME and every module plugged in: about 60 ohms between CAN high and low (BMW); 120 ohms, 40 ohms, 0 ohms or open each point to a different fault. Then steps 20 to 33, in the next figure." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="546" fill="#ffffff"/>
<rect class="shape" x="8" y="7" width="20" height="12" rx="6" stroke-width="1.2"/>
<text class="t-sm" x="34" y="17.5">Question</text>
<rect class="crit-s" x="98.39" y="7" width="20" height="12" rx="1.5" stroke-width="1.2"/>
<text class="t-sm" x="124.39" y="17.5">Stop: fix before going on</text>
<rect class="panel" x="268.73" y="7" width="20" height="12" rx="1.5" stroke-width="1.2"/>
<text class="t-sm" x="294.73" y="17.5">Set-up</text>
<text class="t-sm" x="792" y="17.5" text-anchor="end"><tspan class="t-b">BMW:</tspan> BMW's pass value.  <tspan class="t-b">Generic:</tspan> a guide, not a limit.</text>
<rect class="panel" x="8" y="28" width="156" height="82.5" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="18" y="41.47">Phase 11, before you join</text>
<text class="t-sm" x="18" y="55.47">the E-box plugs</text>
<rect class="shape" x="176" y="28" width="398" height="82.5" rx="18" stroke-width="1.5"/>
<text class="t t-b" x="188" y="57.14">Each pair the same circuit, or empty on one side?</text>
<text class="t" x="188" y="73.14">Both halves of X6011, X6021, X6053/X60531, X6054/X60541</text>
<text class="t" x="188" y="88.14">and X64101/X64102 <tspan class="t-sm">(E-box plug comparison)</tspan></text>
<rect class="crit-s" x="594" y="28" width="198" height="82.5" rx="4" stroke-width="1.5"/>
<text class="t t-b crit-t" x="604" y="42.64">Stop: fix the pair</text>
<text class="t" x="604" y="57.64">Use the M3's X6053 and</text>
<text class="t" x="604" y="72.64">X6054 sections together,</text>
<text class="t" x="604" y="87.64">never an M3 half with a</text>
<text class="t" x="604" y="102.64">Touring half.</text>
<path class="ln" d="M574,69.25 H593" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="584" y="61.25" text-anchor="middle">no</text>
<path class="ln" d="M375,110.5 V124.5" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="382" y="121.5">yes: join the E-box plugs</text>
<rect class="panel" x="8" y="125.5" width="156" height="263.5" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="18" y="138.97">Steps 1–14</text>
<text class="t t-b" x="18" y="154.97">Battery disconnected</text>
<text class="t" x="18" y="169.97">All five DME plugs off,</text>
<text class="t" x="18" y="184.97">ignition off</text>
<rect class="shape" x="176" y="125.5" width="398" height="263.5" rx="18" stroke-width="1.5"/>
<text class="t t-b" x="188" y="140.14">Every step passes?</text>
<text class="t" x="188" y="156.14">Every terminal locked; every cavity as the move table says</text>
<text class="t-sm" x="562" y="156.14" text-anchor="end">1</text>
<text class="t" x="188" y="171.14">Each moved or added wire open to chassis ground</text>
<text class="t-sm" x="562" y="171.14" text-anchor="end">2</text>
<text class="t" x="188" y="186.14">Lamp wires under about 1 Ω (generic)</text>
<text class="t-sm" x="562" y="186.14" text-anchor="end">3</text>
<text class="t" x="188" y="201.14">Oil-pressure switch near 0 Ω, engine stopped</text>
<text class="t-sm" x="562" y="201.14" text-anchor="end">4</text>
<text class="t" x="188" y="216.14">Brake test contact, X60004 pin 34 to X78 pin 3: continuity</text>
<text class="t-sm" x="562" y="216.14" text-anchor="end">5</text>
<text class="t" x="188" y="231.14">Across the gear switch: near 0 Ω in gear, open in neutral</text>
<text class="t-sm" x="562" y="231.14" text-anchor="end">6</text>
<text class="t" x="188" y="246.14">Start interlock, X13635 pin 4 to EWS pin 8: continuity</text>
<text class="t-sm" x="562" y="246.14" text-anchor="end">7</text>
<text class="t" x="188" y="261.14">Sport: open released, near 0 Ω pressed (BMW)</text>
<text class="t-sm" x="562" y="261.14" text-anchor="end">8</text>
<text class="t" x="188" y="276.14">Leak-test triangle: heater on 18, pump (the lowest) on 30</text>
<text class="t-sm" x="562" y="276.14" text-anchor="end">9</text>
<text class="t" x="188" y="291.14">X60004 pin 10 to K96 socket pin 4: continuity</text>
<text class="t-sm" x="562" y="291.14" text-anchor="end">10</text>
<text class="t" x="188" y="306.14">M3 harness X6021 pin 1 to every K96 terminal: open</text>
<text class="t-sm" x="562" y="306.14" text-anchor="end">10</text>
<text class="t" x="188" y="321.14">K96 coil about 90 Ω (generic)</text>
<text class="t-sm" x="562" y="321.14" text-anchor="end">10</text>
<text class="t" x="188" y="336.14">Coils about 0.8 Ω each, all alike (BMW)</text>
<text class="t-sm" x="562" y="336.14" text-anchor="end">11</text>
<text class="t" x="188" y="351.14">Six equal injector readings</text>
<text class="t-sm" x="562" y="351.14" text-anchor="end">12</text>
<text class="t" x="188" y="366.14">Temperature sensors about 2,500 Ω at 20 °C (generic)</text>
<text class="t-sm" x="562" y="366.14" text-anchor="end">13</text>
<text class="t" x="188" y="381.14">Crankshaft sensor: a steady reading, open to ground</text>
<text class="t-sm" x="562" y="381.14" text-anchor="end">14</text>
<rect class="crit-s" x="594" y="125.5" width="198" height="263.5" rx="4" stroke-width="1.5"/>
<text class="t t-b crit-t" x="604" y="230.64">Stop: fix, then re-test</text>
<text class="t" x="604" y="245.64">Reseat or replace the</text>
<text class="t" x="604" y="260.64">terminal; a wrong cavity, such</text>
<text class="t" x="604" y="275.64">as cluster pin 14 instead of</text>
<text class="t" x="604" y="290.64">13; or that step's "If it fails".</text>
<path class="ln" d="M574,257.25 H593" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="584" y="249.25" text-anchor="middle">no</text>
<path class="ln" d="M375,389 V403" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="382" y="400">yes</text>
<rect class="panel" x="8" y="404" width="156" height="98.5" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="18" y="417.47">Steps 15–18</text>
<text class="t t-b" x="18" y="433.47">Battery connected</text>
<text class="t" x="18" y="448.47">DME still unplugged</text>
<rect class="shape" x="176" y="404" width="398" height="98.5" rx="18" stroke-width="1.5"/>
<text class="t t-b" x="188" y="418.64">Every step passes?</text>
<text class="t" x="188" y="434.64">X60001 pin 7: battery voltage, key on or off</text>
<text class="t-sm" x="562" y="434.64" text-anchor="end">15</text>
<text class="t" x="188" y="449.64">X60004 pin 26 at key position 2: above 9 V (BMW)</text>
<text class="t-sm" x="562" y="449.64" text-anchor="end">16</text>
<text class="t" x="188" y="464.64">X60004 pin 26 with the key off: 0 V</text>
<text class="t-sm" x="562" y="464.64" text-anchor="end">16</text>
<text class="t" x="188" y="479.64">K6300 terminal 30: battery voltage, key on or off</text>
<text class="t-sm" x="562" y="479.64" text-anchor="end">17</text>
<text class="t" x="188" y="494.64">Grounds near 0 Ω, under 0.1 V drop (generic)</text>
<text class="t-sm" x="562" y="494.64" text-anchor="end">18</text>
<rect class="crit-s" x="594" y="404" width="198" height="98.5" rx="4" stroke-width="1.5"/>
<text class="t t-b crit-t" x="604" y="426.64">Stop: fix, then re-test</text>
<text class="t" x="604" y="441.64">F102 (80 A), F29,</text>
<text class="t" x="604" y="456.64">X64101/X64102; the ground</text>
<text class="t" x="604" y="471.64">eyelets and strap; or that</text>
<text class="t" x="604" y="486.64">step's "If it fails".</text>
<path class="ln" d="M574,453.25 H593" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="584" y="445.25" text-anchor="middle">no</text>
<path class="ln" d="M375,502.5 V516.5" marker-end="url(#ah)"/>
<text class="t-sm t-b" x="382" y="513.5">yes</text>
<rect class="panel" x="176" y="517.5" width="398" height="22.5" rx="4" stroke-width="1.5"/>
<text class="t" x="375" y="532.14" text-anchor="middle"><tspan class="t-b">Steps 19–33,</tspan> with the DME plugged in: the next figure</text>
</svg>
