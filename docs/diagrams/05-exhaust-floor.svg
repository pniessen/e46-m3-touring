<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" role="img" aria-label="Side section through the rear floor. Today the Touring's spare-wheel well hangs down into the space the M3 muffler needs. After the change, the well is cut out and a shallower floor section from the donor coupe, or a flat panel, is welded in; the muffler fits underneath and the tips exit through a cut-out in the rear bumper." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<rect class="bg" x="0" y="0" width="400" height="336" fill="#ffffff"/>

<!-- Panel A: Touring today -->
<text class="t-h" x="8" y="20">TOURING TODAY</text>
<text class="t-xs" x="392" y="20" text-anchor="end">front ← → rear</text>
<circle class="donor" cx="58" cy="98" r="11" stroke-width="1.5"/>
<text class="t-xs" x="58" y="78" text-anchor="middle">rear axle</text>
<line class="donor-s" x1="20" y1="114" x2="140" y2="114" stroke-width="2.5"/>
<rect class="donor dash" x="140" y="92" width="190" height="36" rx="6" stroke-width="1.5" opacity="0.85"/>
<line class="ln-thin" x1="104" y1="140" x2="141" y2="124"/>
<text class="t-sm donor-t" x="90" y="152" text-anchor="middle">M3 muffler space</text>
<path class="ln" d="M20,58 H150 C160,58 165,62 168,70 L176,112 Q180,122 192,122 H300 Q312,122 316,112 L326,70 C329,62 334,58 344,58 H372" style="stroke-width:2.5"/>
<text class="t-sm" x="247" y="80" text-anchor="middle">spare-wheel well</text>
<path class="ln" d="M372,52 V126" style="stroke-width:3"/>
<text class="t-xs" x="366" y="48" text-anchor="end">bumper</text>
<path class="crit-s" d="M178,112 Q182,122 192,122 H300 Q310,122 314,112" stroke-width="4" opacity="0.9"/>
<line class="ln-thin" x1="280" y1="139" x2="280" y2="124"/>
<text class="t-sm crit-t" x="392" y="152" text-anchor="end">Clash: the well hangs into that space</text>

<line class="ln-faint" x1="8" y1="170" x2="392" y2="170"/>

<!-- Panel B: after -->
<text class="t-h" x="8" y="194">AFTER</text>
<circle class="donor" cx="58" cy="272" r="11" stroke-width="1.5"/>
<line class="donor-s" x1="20" y1="288" x2="140" y2="288" stroke-width="2.5"/>
<rect class="donor" x="140" y="266" width="190" height="36" rx="6" stroke-width="1.5"/>
<text class="t-sm donor-t" x="235" y="289" text-anchor="middle">M3 muffler</text>
<path class="ln" d="M20,232 H160" style="stroke-width:2.5"/>
<path class="fab-s" d="M160,232 C166,232 168,236 170,242 H334 C336,236 338,232 344,232" stroke-width="3"/>
<path class="ln" d="M344,232 H372" style="stroke-width:2.5"/>
<circle class="fab-f" cx="160" cy="232" r="3.5"/>
<circle class="fab-f" cx="344" cy="232" r="3.5"/>
<line class="ln-thin" x1="252" y1="222" x2="252" y2="240"/>
<text class="t-sm fab-t" x="252" y="216" text-anchor="middle">Donor coupe floor section or flat panel</text>
<rect class="donor" x="330" y="290" width="54" height="8" rx="2" stroke-width="1.5"/>
<path class="ln" d="M372,226 V284 M372,302 V306" style="stroke-width:3"/>
<path class="fab-s" d="M368,284 H376 M368,302 H376" stroke-width="2.5"/>
<line class="ln-thin" x1="372" y1="312" x2="372" y2="304"/>
<text class="t-sm fab-t" x="392" y="326" text-anchor="end">Cut the bumper for the tips</text>
<text class="t-xs" x="8" y="326">Welded seams: tack, stitch, seal both sides</text>
</svg>
