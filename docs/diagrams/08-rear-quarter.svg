<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 511" role="img" aria-label="Right side view of the rear quarter and rear door, to scale from BMW drawings. The M3 section to graft is bounded by three seams, which are our inference from the drawings: a top seam 500 to 515 mm above the hub, just under the shoulder crease; a rear seam 550 to 600 mm behind the axle, ahead of the tail lamp and down to about 250 mm above the hub behind the bumper; and a front seam 25 to 40 mm behind the rear door's shut line, parallel to it, down to the sill flange. The M3 bulge inside it stands about 21 to 23 mm proud over the arch and more behind it, mostly in the bumper corner; its profile is in the Flare profile section. The bulge ends on the bumper line about 300 mm behind the axle. The rear door's trailing edge forms the front of the arch, and with a stock door the M3 surface stands about 11 to 20 mm proud at the shut line: blend the nose in before the shut line, as BMW did, or reshape the door edge, then restore BMW's 4 plus or minus 0.75 mm gap. On the right side, take the filler pipe out before welding; your filler pot stays where it is, and the M3 surround and flap come in with the section." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
