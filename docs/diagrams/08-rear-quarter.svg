<text class="t-sm" x="212" y="60">Front: 25–40 mm behind the</text>
<text class="t-sm" x="212" y="74">shut line, down to the sill</text>
<text class="t-xs" x="376" y="104" text-anchor="end">front</text>
<line class="ln" x1="379" y1="100" x2="393" y2="100" marker-end="url(#ah)"/>

