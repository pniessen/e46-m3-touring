<rect class="bg" x="0" y="0" width="400" height="511" fill="#ffffff"/>
<text class="t t-b crit-t" x="8" y="18">Fuel filler, right side</text>
<text class="t-sm" x="8" y="32">Take the filler pipe out before</text>
<text class="t-sm" x="8" y="46">you weld. Your pot, 51718208646,</text>
<text class="t-sm" x="8" y="60">stays where it is; the M3</text>
<text class="t-sm" x="8" y="74">surround and flap come with</text>
<text class="t-sm" x="8" y="88">the section.</text>
<text class="t t-b fab-t" x="212" y="18">Seams (our inference)</text>
<text class="t-sm" x="212" y="32">Top: 500–515 mm above the hub</text>
