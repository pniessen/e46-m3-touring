<text class="t-sm t-b" x="8" y="300">Front diff, type 174</text>
<text class="t-sm" x="8" y="314">bolted to the pan's</text>
<text class="t-sm" x="8" y="328">left side</text>
<line class="ln-thin" x1="92" y1="289" x2="128" y2="273"/>
<text class="t-sm t-b" x="8" y="380">Front prop shaft</text>
<text class="t-xs t-mono" x="8" y="394">26207525970</text>
<text class="t-sm" x="8" y="408">723 mm, from</text>
<text class="t-sm" x="8" y="422">03/2003</text>
<text class="t-sm crit-t" x="258" y="304">Headers to the right</text>
<text class="t-sm crit-t" x="258" y="318">shaft and bracket:</text>
<text class="t-sm crit-t" x="258" y="332">check on the car</text>
<line class="crit-s" x1="256" y1="293" x2="257" y2="281" stroke-width="1"/>
<text class="t-sm" x="258" y="362">Pan machined or</text>
<text class="t-sm" x="258" y="376">re-made on both builds</text>
<line class="ln-thin" x1="254" y1="358" x2="226" y2="358"/>
<text class="t-sm t-b" x="258" y="416">330xi six-speed</text>
<text class="t-xs t-mono" x="258" y="430">23007563053</text>
<text class="t-sm" x="258" y="444">from 03/2003, on the M3</text>
<text class="t-sm" x="258" y="458">flywheel with a Z4 M</text>
<text class="t-sm" x="258" y="472">clutch, as in BMW's Z4 M</text>
<line class="ln-thin" x1="254" y1="412" x2="223" y2="412"/>
<text class="t-sm t-b" x="258" y="504">NV 124 transfer case</text>
<text class="t-xs t-mono" x="258" y="518">27107530812</text>
<text class="t-sm" x="258" y="532">38:62 torque, 1:1 speed</text>
<text class="t-sm crit-t" x="258" y="546">BMW: 300 Nm max;</text>
<text class="t-sm crit-t" x="258" y="560">US S54: 355 Nm</text>
<line class="ln-thin" x1="254" y1="500" x2="222" y2="500"/>
<rect class="panel" x="8" y="578" width="184" height="124" rx="5" stroke-width="1"/>
<text class="t-sm t-b" x="16" y="596">Diff ratios must match</text>
<text class="t-sm" x="16" y="612">Both prop shafts turn at the</text>
<text class="t-sm" x="16" y="626">same speed. Both builds used</text>
<text class="t-sm" x="16" y="640">an X3 3.91 pair; the</text>
<text class="t-sm" x="16" y="654">325xi/330xi automatic 3.46</text>
<text class="t-sm" x="16" y="668">pair gives near-M3 gearing.</text>
<text class="t-sm" x="16" y="682">X3 rear flanges don't fit</text>
<text class="t-sm" x="16" y="696">the xi rear shafts.</text>
<rect class="panel" x="208" y="578" width="184" height="96" rx="5" stroke-width="1"/>
<text class="t-sm t-b" x="216" y="596">Stays</text>
<text class="t-sm" x="216" y="612">Your front axle, knuckles,</text>
<text class="t-sm" x="216" y="626">shafts and rack; your</text>
<text class="t-sm" x="216" y="640">Bosch DSC 5.7 and its four</text>
<text class="t-sm" x="216" y="654">sensors; the crossmember</text>
<text class="t-sm" x="216" y="668">and rear prop shaft.</text>
<text class="t-sm" x="200" y="780" text-anchor="middle">Rear diff, type 188: same ratio as the front</text>

<!-- Panel B: convert to rear drive -->
<line class="ln-faint" x1="8" y1="802" x2="392" y2="802"/>
<text class="t-h" x="8" y="828">OR CONVERT TO REAR DRIVE</text>
<text class="t-sm" x="8" y="845">The same view, smaller: the car after the conversion.</text>
<rect class="keep dash" x="8" y="858" width="384" height="72" rx="5" stroke-width="1.5"/>
<path class="crit-s" d="M18,867 l10,10 M18,877 l10,-10" stroke-width="2"/>
<text class="t-sm t-b crit-t" x="36" y="876.5">Comes out</text>
<text class="t-sm" x="18" y="894">Transfer case, front diff, front shafts and front prop shaft;</text>
<text class="t-sm" x="18" y="908">the xi front subframe, knuckles and rack; the Bosch DSC 5.7</text>
<text class="t-sm" x="18" y="922">with its sensors.</text>
<rect class="donor" x="136" y="944" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm t-b" x="154" y="954">Goes in</text>
<text class="t-sm" x="136" y="970">M3 front subframe and axle:</text>
<text class="t-sm" x="136" y="984"><tspan class="crit-t">trial-fit it first</tspan></text>
<text class="t-sm" x="136" y="1002">M3 gearbox on a <tspan class="fab-t">custom</tspan></text>
<text class="t-sm" x="136" y="1016"><tspan class="fab-t">crossmember bracket</tspan></text>
<text class="t-sm" x="136" y="1034">M3 lower steering joint and coupling</text>
<text class="t-sm" x="136" y="1052">MK60 with an <tspan class="fab-t">adapter loom</tspan></text>
<text class="t-sm" x="136" y="1066">xi: 42-pin plug, CAN pins 24/40</text>
<text class="t-sm" x="136" y="1080">MK60: 47-pin plug, CAN pins 11/15</text>
<text class="t-sm" x="136" y="1094">Wire it signal by signal</text>
<line class="ln dash" x1="8" y1="1110" x2="392" y2="1110" stroke-width="1.5"/>
<text class="t-xs" x="392" y="1124" text-anchor="end">front seats</text>
