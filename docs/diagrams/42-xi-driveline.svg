<!-- Panel A: keep all-wheel drive -->
<text class="t-h" x="8" y="66">KEEP ALL-WHEEL DRIVE</text>
<text class="t-sm" x="8" y="83">Seen from above, front at the top. Schematic, not to scale.</text>
<rect class="warn-f" x="8" y="96" width="384" height="110" rx="5" stroke-width="1.5"/>
<text class="t t-b crit-t" x="18" y="115">Hazard: the front of the oil pan</text>
<text class="t-sm" x="18" y="132">Your xi pan 11137519432 has the right axle tube welded</text>
<text class="t-sm" x="18" y="146">through its front, the zone where the S54's two-stage pump</text>
<text class="t-sm" x="18" y="160">has its scavenge pickup. Both builds fitted an M50-family</text>
<text class="t-sm" x="18" y="174">single-stage pump instead. On one, the pump chain ground</text>
<text class="t-sm" x="18" y="188">into the pan and wrecked the bottom end. Prove every</text>
<text class="t-sm" x="18" y="202">clearance with clay, and oil pressure against the donor's.</text>
<text class="t-xs" x="8" y="222">left (driver's side)</text>
<text class="t-xs" x="392" y="222" text-anchor="end">right</text>
