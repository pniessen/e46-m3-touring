<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 732" role="img" aria-label="The DSC and brake choice. A donor built before 09/2002 has an MK20 with a 43-pin plug, which won't plug into your harness, so only route A applies; a donor built from 09/2002 has an MK60 with the same 47-pin plug and yaw sensor as your Touring, so either route works. Route A, the recommended default, keeps your MK60, master cylinder and booster: no coding, just initialise its VIN and steering angle in INPA and run the compensation routines. It stays coded for a 325i with no M Track. Your master cylinder is the 330i's, so expect a front pedal about 10% longer and lighter than an M3's (our estimate); one 2004 Touring with M3 brakes reported a firm pedal. Check the unit's label first, as some US Tourings have an ASC-only unit. Route B fits the M3's MK60 and master cylinder, with your booster or perhaps the M3's. NCS Expert codes it only from a session-only vehicle order with the donor's M3 type key and a date from 09/2002, and it then takes the M3's values; its coding has no Touring body type, so it stays coupe_m. It brings M Track; a Touring built before 09/2001 also needs the later yaw-sensor cluster. Then run INPA's VIN and steering-angle initialisation; if VIN not initialized still won't clear, refit your own unit. On both routes your brake pipes stay, since an MK60 M3 uses the same front pipes and the rear pipes and hoses are shared; the M3-only front brake hoses 34322229723 are bought new; the M3 calipers come with the corners; and your own wheel-speed sensors stay, the same parts as on M3s from 09/2002. An MK20 donor's inductive sensors with gray plugs don't fit, so never splice them in. The booster takes a new grommet 34336765316 and the M3's check valve 34331161300, on the S54's vacuum hose shortened to reach it. Calibrate the steering angle after the wheel alignment, and keep your MK60, booster, master cylinder and cluster until the car has passed inspection." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="732" fill="#ffffff"/>

<!-- Key -->
<rect class="keep" x="8" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="25" y="16.5">Keep</text>
<rect class="donor" x="66.4" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="83.4" y="16.5">From donor M3</text>
<rect class="new" x="177.9" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="194.9" y="16.5">Buy new</text>

<!-- Which unit the donor has -->
<rect class="donor" x="8" y="28" width="188" height="52" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="18" y="45">Donor built before 09/2002</text>
<text class="t-xs" x="18" y="59">MK20, 43-pin plug:</text>
<text class="t-xs crit-t" x="18" y="72">won't plug into your harness</text>
<rect class="donor" x="204" y="28" width="188" height="52" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="214" y="45">Donor built from 09/2002</text>
<text class="t-xs" x="214" y="59">MK60: same 47-pin plug and yaw</text>
<text class="t-xs" x="214" y="72">sensor as your Touring's</text>
<line class="ln" x1="102" y1="80" x2="102" y2="99" marker-end="url(#ah)"/>
<line class="ln" x1="298" y1="80" x2="298" y2="99" marker-end="url(#ah)"/>
<path class="ln" d="M240,80 V89 H150 V99" marker-end="url(#ah)"/>

<!-- Route A -->
<text class="t-h" x="8" y="116">A  KEEP YOURS</text>
<text class="t-xs t-b" x="8" y="130">the default; recommended</text>
<text class="t-xs" x="8" y="148">No coding: initialise its VIN and</text>
<text class="t-xs" x="8" y="161">steering angle in INPA, then run the</text>
<text class="t-xs" x="8" y="174">compensation routines</text>
<text class="t-xs" x="8" y="191">Stays coded for a 325i: no M Track</text>
<text class="t-xs" x="8" y="208">Your master cylinder is the 330i's:</text>
<text class="t-xs" x="8" y="221">expect a front pedal about 10% longer</text>
<text class="t-xs" x="8" y="234">and lighter than an M3's (our</text>
<text class="t-xs" x="8" y="247">estimate). One 2004 Touring with M3</text>
<text class="t-xs" x="8" y="260">brakes reported a firm pedal</text>
<text class="t-xs" x="8" y="277">Check its label first: some US Tourings</text>
<text class="t-xs" x="8" y="290">have an ASC-only unit</text>

<!-- Route B -->
<text class="t-h" x="204" y="116">B  FIT THE M3'S UNIT</text>
<text class="t-xs t-b" x="204" y="130">09/2002-on donors only</text>
<text class="t-xs" x="204" y="148">Codes only from a session order with</text>
<text class="t-xs" x="204" y="161">the donor's M3 type key and a 09/2002+</text>
<text class="t-xs" x="204" y="174">date; it then takes the M3's values.</text>
<text class="t-xs" x="204" y="187">No Touring body type: leave coupe_m</text>
<text class="t-xs" x="204" y="204">Brings M Track</text>
<text class="t-xs" x="204" y="221">Touring built before 09/2001: also the</text>
<text class="t-xs" x="204" y="234">later yaw-sensor cluster</text>
<text class="t-xs" x="204" y="251">Then INPA's VIN and steering-angle</text>
<text class="t-xs" x="204" y="264">initialisation. "VIN not initialized"</text>
<text class="t-xs" x="204" y="277">still on? Refit your own unit</text>

<!-- Brake hydraulics, pedal to caliper -->
<rect class="keep" x="8" y="306" width="188" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="328.6">Your booster</text>
<rect class="keep" x="204" y="306" width="188" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="320.7">Your booster</text>
<text class="t-xs" x="214" y="334.2">or perhaps the M3's</text>
<line class="ln" x1="102" y1="342" x2="102" y2="352"/>
<line class="ln" x1="298" y1="342" x2="298" y2="352"/>
<rect class="keep" x="8" y="352" width="188" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="366.7">Your master cylinder</text>
<text class="t-xs" x="18" y="380.2">the 330i's</text>
<rect class="donor" x="204" y="352" width="188" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="374.6">M3 master cylinder</text>
<line class="ln" x1="102" y1="388" x2="102" y2="398"/>
<line class="ln" x1="298" y1="388" x2="298" y2="398"/>
<rect class="keep" x="8" y="398" width="188" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="415.6">Your MK60</text>
<text class="t-xs" x="186" y="414.7" text-anchor="end">DSC unit</text>
<rect class="donor" x="204" y="398" width="188" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="214" y="415.6">M3 MK60</text>
<text class="t-xs" x="382" y="414.7" text-anchor="end">DSC unit</text>
<line class="ln" x1="102" y1="424" x2="102" y2="434"/>
<line class="ln" x1="298" y1="424" x2="298" y2="434"/>

<!-- Same on both routes -->
<rect class="keep" x="8" y="434" width="384" height="38" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="18" y="449.5">Your brake pipes stay</text>
<text class="t-xs" x="18" y="463">an MK60 M3 uses the same front pipes; the rear pipes and hoses are shared</text>
<line class="ln" x1="200" y1="472" x2="200" y2="482"/>
<rect class="new" x="8" y="482" width="384" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="499.6">M3 front brake hoses</text>
<text class="t-xs" x="382" y="498.7" text-anchor="end">M3-only, buy new: 34322229723</text>
<line class="ln" x1="200" y1="508" x2="200" y2="518"/>
<rect class="donor" x="8" y="518" width="384" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="535.6">M3 calipers</text>
<text class="t-xs" x="382" y="534.7" text-anchor="end">with the corners and trailing arms</text>
<rect class="keep" x="8" y="552" width="384" height="26" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="569.6">Your wheel-speed sensors</text>
<text class="t-xs" x="382" y="568.7" text-anchor="end">the same parts on M3s from 09/2002</text>

<!-- Both routes -->
<rect class="panel" x="8" y="586" width="384" height="138" rx="6" stroke-width="1"/>
<text class="t-sm t-b" x="18" y="603">Both routes</text>
<text class="t-xs" x="18" y="618">Wheel-speed sensors: yours read the M3 hubs and half-shafts. An MK20</text>
<text class="t-xs" x="18" y="631">donor's inductive sensors (gray plugs) don't fit your harness: never splice</text>
<text class="t-xs" x="18" y="644">them in.</text>
<text class="t-xs" x="18" y="659">Booster vacuum: a new grommet 34336765316 and the M3's check valve</text>
<text class="t-xs" x="18" y="672">34331161300 in your booster, on the S54's hose shortened to reach it.</text>
<text class="t-xs" x="18" y="687">Calibrate the steering angle after the wheel alignment.</text>
<text class="t-xs" x="18" y="702">Keep your MK60, booster, master cylinder and cluster until the car has</text>
<text class="t-xs" x="18" y="715">passed inspection.</text>
</svg>
