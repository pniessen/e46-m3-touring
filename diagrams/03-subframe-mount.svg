<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Schematic cross-section of a rear subframe mount: the floor is two sheets with a gap, the mount gusset is tacked only to the lower sheet, and cracks start at those spot welds. A reinforcement plate is plug-welded under the floor, and on the cargo side a window is cut over each rear mount, the three factory rosette welds are welded, and a cover plate closes it." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="320" fill="#ffffff"/>

<text class="t-xs t-b" x="8" y="40">CARGO SIDE</text>
<text class="t-xs t-b" x="8" y="188">UNDERSIDE</text>

<!-- Floor: two sheets with a gap -->
<path class="ln" d="M122,96 H226 M278,96 H392" style="stroke-width:3"/>
<path class="ln" d="M122,156 H392" style="stroke-width:3"/>
<text class="t-xs" x="392" y="88" text-anchor="end">upper sheet</text>
<text class="t-xs" x="392" y="148" text-anchor="end">lower sheet</text>

<!-- Mount gusset (body), tacked to the lower sheet only -->
<path class="keep-s" d="M200,156 V104 Q200,98 206,98 H298 Q304,98 304,104 V156 M188,154 H200 M304,154 H316" stroke-width="2.5"/>
<rect class="keep" x="245" y="98" width="14" height="58"/>

<!-- Cargo-side fix: window, welded spot welds, cover plate -->
<rect class="fab" x="218" y="84" width="68" height="7" rx="1" stroke-width="1.5"/>
<circle class="fab-f" cx="232" cy="98" r="3.5"/>
<circle class="fab-f" cx="270" cy="98" r="3.5"/>
<circle class="fab-f" cx="284" cy="98" r="3.5"/>

<!-- Cracks at the lower spot welds -->
<path class="crit-s" d="M190,136 l5,4 l-5,4 l5,4 l-5,4 l5,4" stroke-width="2"/>
<path class="crit-s" d="M310,136 l5,4 l-5,4 l5,4 l-5,4 l5,4" stroke-width="2"/>

<!-- Underside reinforcement plate with plug welds -->
<rect class="fab" x="168" y="158" width="78" height="7" rx="1" stroke-width="1.5"/>
<rect class="fab" x="258" y="158" width="78" height="7" rx="1" stroke-width="1.5"/>
<circle class="fab-f" cx="184" cy="161.5" r="3"/>
<circle class="fab-f" cx="216" cy="161.5" r="3"/>
<circle class="fab-f" cx="290" cy="161.5" r="3"/>
<circle class="fab-f" cx="322" cy="161.5" r="3"/>

<!-- Subframe bushing, arm and bolt -->
<rect class="donor" x="220" y="172" width="64" height="56" rx="12" stroke-width="1.5"/>
<rect class="donor" x="284" y="190" width="108" height="20" stroke-width="1.5"/>
<text class="t-xs donor-t" x="338" y="203.5" text-anchor="middle">M3 subframe</text>
<rect class="fill-fg" x="249" y="104" width="6" height="142"/>
<rect class="fill-fg" x="242" y="246" width="20" height="8" rx="1"/>

<!-- Load -->
<line class="ln" x1="372" y1="218" x2="372" y2="262" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="t-sm" x="392" y="282" text-anchor="end">Diff torque reversals</text>
<text class="t-sm" x="392" y="297" text-anchor="end">flex the mount</text>

<!-- Labels and leaders -->
<g class="ln-thin">
  <path d="M112,80 L218,88"/>
  <path d="M112,118 L230,100"/>
  <path d="M112,150 L200,132"/>
  <path d="M112,208 L190,146"/>
  <path d="M112,248 L176,165"/>
  <path d="M112,288 L220,212"/>
</g>
<text class="t" x="8" y="74">Cover plate over</text>
<text class="t" x="8" y="90">a cut-out window</text>
<text class="t fab-t" x="8" y="112">Weld the three</text>
<text class="t fab-t" x="8" y="128">factory rosette welds</text>
<text class="t" x="8" y="150">Gusset tacked to</text>
<text class="t" x="8" y="166">lower sheet only</text>
<text class="t crit-t" x="8" y="210">Cracks start at</text>
<text class="t crit-t" x="8" y="226">the spot welds</text>
<text class="t fab-t" x="8" y="250">Plate + plug welds</text>
<text class="t fab-t" x="8" y="266">spread the load</text>
<text class="t" x="8" y="290">Bushing and M12</text>
<text class="t" x="8" y="306">bolt from below</text>
</svg>
