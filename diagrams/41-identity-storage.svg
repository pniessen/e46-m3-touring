<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 962" role="img" aria-label="Where the car's identity lives after the swap, and which copy each coding session reads and writes. The light module (ALSZ), your Touring's own, is the master record: it holds the last 7 characters of your VIN, your true mileage in steps of 100 km, which can only go up, and your Touring's vehicle order, the car's true order and the source for every other module; never write a VIN or mileage into it to match a cluster. At every key-on it and the cluster compare VIN and mileage, and a mismatch lights the tamper dot; your true mileage passes to the cluster only once the VINs match and the cluster reads zero. The M3 cluster (AKMB, coding file KMBE46M3.C23 or C24) holds your VIN, set by a service or on a new chip, and your car's true mileage only, taken from the light module; after the chip route it holds the donor M3's vehicle order, which stays there for good, because NCS accepts an M3 cluster only with an M3 order, and it is coded only from a complete coding file made from its own read-out. The DME (MSS54 or HP) holds your VIN in a free AIF slot (Session 2) and no vehicle order. The DSC unit (MK60) holds a VIN, initialised or written into an M3 unit in Session 5, checks it against the cluster's, and holds no vehicle order. Your EWS holds your VIN but no vehicle order on a car built from 09/2001, so it is no backup copy. Session 1, with your own cluster still fitted: NCS Expert reads the order from ALSZ and from AKMB; they should match, and if not, trust ALSZ; the donor's order is screenshot in the donor in Phase 1. Session 4, with the M3 cluster fitted: read ALSZ, which must still match the Session 1 screenshot, and read AKMB, which holds the donor's order; code the cluster with that order loaded, from its own read-out, and write no order into it. Session 5, option B only: read ALSZ, give the session a date of #0902 or later and the donor's M3 type code for this session only, and code the M3 MK60, with no FA_WRITE. Session 8, a vehicle-order change: read ALSZ, change the order in the session, FA_WRITE it back to ALSZ only, and code only the modules the change touches; the cluster keeps the donor's order, and Code Car is never run. Session 9, xenon only, with a new light module: it holds no order yet, so type yours from the Session 1 screenshot, add $522 and FA_WRITE it to the new module; once it has your VIN it takes the cluster's true mileage, so fit only a new or virginized module." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="962" fill="#ffffff"/>

<!-- Key -->
<rect class="keep" x="8" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="25" y="16.5">Keep</text>
<rect class="donor" x="65.9" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="82.9" y="16.5">From donor M3</text>
<rect class="new" x="175.7" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="192.7" y="16.5">Buy new</text>
<rect class="shape" x="251.5" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="268.5" y="16.5">NCS Expert session</text>
<text class="t-xs t-b" x="8" y="40">WHERE THE CAR'S IDENTITY LIVES</text>

<!-- The light module: the car's own record -->
<rect class="keep" x="8" y="48" width="384" height="93" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="65">Light module (ALSZ)</text>
<text class="t-xs t-b" x="382" y="65" text-anchor="end">your Touring's: the master record</text>
<text class="t-xs t-b" x="18" y="80">VIN</text>
<text class="t-xs" x="100" y="80">the last 7 characters of yours</text>
<text class="t-xs t-b" x="18" y="93">Mileage</text>
<text class="t-xs" x="100" y="93">your true mileage, in steps of 100 km; it can only go up</text>
<text class="t-xs t-b" x="18" y="106">Vehicle order</text>
<text class="t-xs" x="100" y="106">your Touring's: the car's true order, and the source for every</text>
<text class="t-xs" x="100" y="119">other module</text>
<text class="t-xs crit-t" x="18" y="132">Never write a VIN or mileage into it to match a cluster.</text>

<!-- Between the two: the key-on compare, and the one-way mileage transfer -->
<line class="ln" x1="22" y1="142" x2="22" y2="195" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="t-xs" x="32" y="157">Compared at every key-on: a</text>
<text class="t-xs" x="32" y="170">mismatch lights the tamper dot</text>
<line class="ln" x1="214" y1="142" x2="214" y2="195" marker-end="url(#ah)"/>
<text class="t-xs" x="224" y="157">Your true mileage passes to the</text>
<text class="t-xs" x="224" y="170">cluster only once the VINs</text>
<text class="t-xs" x="224" y="183">match and the cluster reads zero</text>

<!-- The M3 cluster: your VIN and true mileage, the donor's vehicle order -->
<rect class="donor" x="8" y="196" width="384" height="106" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="18" y="213">M3 cluster (AKMB)</text>
<text class="t-xs t-mono" x="382" y="213" text-anchor="end">KMBE46M3.C23 or C24</text>
<text class="t-xs t-b" x="18" y="228">VIN</text>
<text class="t-xs" x="100" y="228">yours, set by a service or on a new chip</text>
<text class="t-xs t-b" x="18" y="241">Mileage</text>
<text class="t-xs" x="100" y="241">your car's true mileage only, from the light module</text>
<text class="t-xs t-b" x="18" y="254">Vehicle order</text>
<text class="t-xs" x="100" y="254">the donor M3's after the chip route, left there for good: NCS</text>
<text class="t-xs" x="100" y="267">accepts an M3 cluster only with an M3 order</text>
<text class="t-xs t-b" x="18" y="280">Coding</text>
<text class="t-xs" x="100" y="280">only from a complete coding file made from its own</text>
<text class="t-xs" x="100" y="293">read-out</text>

<!-- The other modules: a VIN, but no vehicle order -->
<rect class="donor" x="8" y="328" width="120" height="93" rx="5" stroke-width="1.5"/>
<text class="t" x="18" y="345"><tspan class="t-b">DME</tspan><tspan class="t-xs">  MSS54 or HP</tspan></text>
<text class="t-xs" x="18" y="360">VIN: yours, in a free</text>
<text class="t-xs" x="18" y="373">AIF slot (Session 2).</text>
<text class="t-xs" x="18" y="386">No vehicle order: it</text>
<text class="t-xs" x="18" y="399">isn't coded from</text>
<text class="t-xs" x="18" y="412">one.</text>
<rect class="keep" x="140" y="328" width="120" height="93" rx="5" stroke-width="1.5"/>
<text class="t" x="150" y="345"><tspan class="t-b">DSC unit</tspan><tspan class="t-xs">  MK60</tspan></text>
<text class="t-xs" x="150" y="360">VIN: initialised, or</text>
<text class="t-xs" x="150" y="373">written into an M3</text>
<text class="t-xs" x="150" y="386">unit (Session 5).</text>
<text class="t-xs" x="150" y="399">No vehicle order.</text>
<rect class="keep" x="272" y="328" width="120" height="93" rx="5" stroke-width="1.5"/>
<text class="t" x="282" y="345"><tspan class="t-b">EWS</tspan><tspan class="t-xs">  yours</tspan></text>
<text class="t-xs" x="282" y="360">Holds your VIN, but</text>
<text class="t-xs" x="282" y="373">no vehicle order</text>
<text class="t-xs" x="282" y="386">(from 09/2001): not</text>
<text class="t-xs" x="282" y="399">a backup copy.</text>
<line class="ln" x1="200" y1="327" x2="200" y2="303" marker-end="url(#ah)"/>
<text class="t-xs" x="208" y="319">checks its VIN against the cluster's</text>
<text class="t-xs t-b" x="8" y="445">WHICH COPY EACH SESSION READS AND WRITES</text>

<!-- Session 1, Phase 0: your Touring's own cluster still fitted -->
<text class="t-xs t-b" x="8" y="464">Session 1, Phase 0: your Touring's own cluster still fitted</text>
<rect class="keep" x="8" y="475" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="46" y="492.5" text-anchor="middle">ALSZ</text>
<rect class="shape" x="156" y="475" width="88" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="200" y="492.5" text-anchor="middle">NCS session</text>
<rect class="keep" x="316" y="475" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="354" y="492.5" text-anchor="middle">AKMB</text>
<line class="ln" x1="84" y1="488" x2="155" y2="488" marker-end="url(#ah)"/>
<text class="t-xs" x="119.5" y="483" text-anchor="middle">read</text>
<line class="ln" x1="316" y1="488" x2="245" y2="488" marker-end="url(#ah)"/>
<text class="t-xs" x="280.5" y="483" text-anchor="middle">read</text>
<text class="t-xs" x="8" y="515">Both copies hold your order and should match; if not, trust ALSZ. Screenshot</text>
<text class="t-xs" x="8" y="528">the donor's order too, in the donor (Phase 1).</text>

<!-- Session 4: the M3 cluster fitted -->
<text class="t-xs t-b" x="8" y="553">Session 4: the M3 cluster fitted</text>
<rect class="keep" x="8" y="564" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="46" y="581.5" text-anchor="middle">ALSZ</text>
<rect class="shape" x="156" y="564" width="88" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="200" y="581.5" text-anchor="middle">NCS session</text>
<rect class="donor" x="316" y="564" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="354" y="581.5" text-anchor="middle">AKMB</text>
<line class="ln" x1="84" y1="577" x2="155" y2="577" marker-end="url(#ah)"/>
<text class="t-xs" x="119.5" y="572" text-anchor="middle">read</text>
<line class="ln" x1="316" y1="571" x2="245" y2="571" marker-end="url(#ah)"/>
<text class="t-xs" x="280.5" y="566" text-anchor="middle">read</text>
<line class="ln" x1="244" y1="583" x2="315" y2="583" marker-end="url(#ah)"/>
<text class="t-xs" x="279.5" y="598" text-anchor="middle">code</text>
<text class="t-xs" x="8" y="614">ALSZ must still match your Session 1 screenshot. Code the cluster with its own</text>
<text class="t-xs" x="8" y="627">(the donor's) order loaded, from its own read-out. Write no order into it.</text>

<!-- Session 5, option B only: the M3's MK60 -->
<text class="t-xs t-b" x="8" y="652">Session 5, option B only: the M3's MK60</text>
<rect class="keep" x="8" y="663" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="46" y="680.5" text-anchor="middle">ALSZ</text>
<rect class="shape" x="156" y="663" width="88" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="200" y="680.5" text-anchor="middle">NCS session</text>
<rect class="donor" x="316" y="663" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="354" y="680.5" text-anchor="middle">M3 MK60</text>
<line class="ln" x1="84" y1="676" x2="155" y2="676" marker-end="url(#ah)"/>
<text class="t-xs" x="119.5" y="671" text-anchor="middle">read</text>
<line class="ln" x1="244" y1="676" x2="315" y2="676" marker-end="url(#ah)"/>
<text class="t-xs" x="279.5" y="671" text-anchor="middle">code</text>
<text class="t-xs" x="8" y="703">For this session only: a date of #0902 or later and the donor's M3 type code.</text>
<text class="t-xs" x="8" y="716">No FA_WRITE.</text>

<!-- Session 8: a vehicle-order change -->
<text class="t-xs t-b" x="8" y="741">Session 8: a vehicle-order change</text>
<rect class="keep" x="8" y="752" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="46" y="769.5" text-anchor="middle">ALSZ</text>
<rect class="shape" x="156" y="752" width="88" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="200" y="769.5" text-anchor="middle">NCS session</text>
<rect class="keep" x="316" y="752" width="76" height="36" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="354" y="767" text-anchor="middle">Modules it</text>
<text class="t-xs" x="354" y="779" text-anchor="middle">touches</text>
<line class="ln" x1="84" y1="764" x2="155" y2="764" marker-end="url(#ah)"/>
<text class="t-xs" x="119.5" y="759" text-anchor="middle">read</text>
<line class="ln" x1="156" y1="776" x2="85" y2="776" marker-end="url(#ah)"/>
<text class="t-xs t-mono" x="120.5" y="791" text-anchor="middle">FA_WRITE</text>
<line class="ln" x1="244" y1="770" x2="315" y2="770" marker-end="url(#ah)"/>
<text class="t-xs" x="279.5" y="765" text-anchor="middle">code</text>
<text class="t-xs" x="8" y="807">Change it in the session and write it back to ALSZ only. The cluster keeps the</text>
<text class="t-xs" x="8" y="820">donor's order. Never run Code Car.</text>

<!-- Session 9, xenon only: a new light module -->
<text class="t-xs t-b" x="8" y="845">Session 9, xenon only: a new light module</text>
<rect class="new" x="8" y="856" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="46" y="873.5" text-anchor="middle">New ALSZ</text>
<rect class="shape" x="156" y="856" width="88" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="200" y="873.5" text-anchor="middle">NCS session</text>
<rect class="donor" x="316" y="856" width="76" height="26" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="354" y="873.5" text-anchor="middle">AKMB</text>
<line class="ln" x1="156" y1="869" x2="85" y2="869" marker-end="url(#ah)"/>
<text class="t-xs t-mono" x="120.5" y="864" text-anchor="middle">FA_WRITE</text>
<path class="ln" d="M354.0,882.0 V890.0 H46.0 V883.0" marker-end="url(#ah)"/>
<text class="t-xs" x="200" y="902" text-anchor="middle">true mileage</text>
<text class="t-xs" x="8" y="918">It holds no order yet: type yours from your Session 1 screenshot and add $522.</text>
<text class="t-xs" x="8" y="931">Once it has your VIN, it takes the cluster's true mileage, so fit only a new or</text>
<text class="t-xs" x="8" y="944">virginized module.</text>
</svg>
