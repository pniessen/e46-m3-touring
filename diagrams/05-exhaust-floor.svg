<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-label="Side section through the rear floor, front to the left, schematic: the positions along the car are roughly to scale but the heights are not, because no depths are published. Today, your Touring's deep spare-wheel well hangs down into the space the M3 muffler needs behind the rear axle, so the two clash. After the change, the well is drilled out and a new BMW M3 trunk floor, 41127895619, with its front reinforcement 51717894229, or the donor's M3 floor, is plug-welded in at the factory spot-weld positions and sealed on both faces. It has a shallow well at the front and is flat at the rear, so the M3 muffler, 18107831783 at 26.7 kg, fits underneath with the M3 heat shield 51482494848 between them, and the tips exit through cut-outs in the rear bumper." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="410" fill="#ffffff"/>
<text class="t-h" x="8" y="20">TOURING TODAY</text>
<text class="t-xs" x="392" y="20" text-anchor="end">front ← → rear</text>
<circle class="donor" cx="103" cy="100" r="11" stroke-width="1.5"/>
<text class="t-xs" x="103" y="80" text-anchor="middle">rear axle</text>
<line class="donor-s" x1="20" y1="117" x2="152.9" y2="117" stroke-width="2.5"/>
<rect class="donor dash" x="246.1" y="96" width="91.8" height="38" rx="6" stroke-width="1.5" opacity="0.85"/>
<path class="ln" d="M20,58 H148.9 C158.9,58 162.9,64 165.9,74 L174.9,120 Q178.9,130 190.9,130 H274.3 Q286.3,130 290.3,120 L299.3,74 C302.3,64 306.3,58 316.3,58 H340.6" stroke-width="2.5"/>
<path class="crit-s" d="M246.1,130 H274.3 Q286.3,130 290.3,120 L293.8,102" stroke-width="4"/>
<path class="ln" d="M340.6,58 V50" stroke-width="2.5"/>
<path class="ln" d="M371.7,52 V140" stroke-width="3"/>
<text class="t-xs" x="371.7" y="44" text-anchor="middle">bumper</text>
<text class="t-sm" x="220.6" y="38" text-anchor="middle">spare-wheel well</text>
<text class="t-xs" x="220.6" y="51" text-anchor="middle">(depth not published)</text>
<line class="ln-thin" x1="112" y1="152" x2="254.1" y2="134"/>
<text class="t-sm donor-t" x="8" y="164">M3 muffler space</text>
<line class="ln-thin" x1="276.3" y1="147" x2="272.3" y2="134"/>
<text class="t-sm crit-t" x="392" y="164" text-anchor="end">Clash: the well hangs into it</text>
<line class="ln-faint" x1="8" y1="182" x2="392" y2="182"/>
<text class="t-h" x="8" y="206">AFTER</text>
<circle class="donor" cx="103" cy="314" r="11" stroke-width="1.5"/>
<line class="donor-s" x1="20" y1="331" x2="246.1" y2="331" stroke-width="2.5"/>
