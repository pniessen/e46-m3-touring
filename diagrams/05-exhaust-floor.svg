<rect class="new" x="149.9" y="274" width="13" height="6" rx="1" stroke-width="1.2"/>
<path class="ln" d="M340.6,272 V264" stroke-width="2.5"/>
<circle class="fab-f" cx="148.9" cy="272" r="3.5"/>
<circle class="fab-f" cx="340.6" cy="272" r="3.5"/>
<path class="donor-s dash" d="M240.7,281 H340.6" stroke-width="2"/>
<rect class="donor" x="246.1" y="292" width="91.8" height="40" rx="6" stroke-width="1.5"/>
<text class="t-sm donor-t" x="292" y="309" text-anchor="middle">M3 muffler</text>
<text class="t-xs donor-t" x="292" y="323" text-anchor="middle">26.7 kg</text>
<rect class="donor" x="331.9" y="319" width="51.9" height="8" rx="2" stroke-width="1.5"/>
<path class="ln" d="M371.7,266 V314 M371.7,332 V338" stroke-width="3"/>
<path class="fab-s" d="M367.7,314 H375.7 M367.7,332 H375.7" stroke-width="2.5"/>
<text class="t-sm new-t t-b" x="8" y="226">New BMW M3 trunk floor 41127895619</text>
<text class="t-xs" x="8" y="240">with reinforcement <tspan class="t-mono">51717894229</tspan>, or the donor's</text>
<text class="t-xs" x="8" y="252.5">shallow well at the front, flat over the muffler</text>
<line class="ln-thin" x1="242.3" y1="250" x2="294.7" y2="269"/>
<text class="t-xs donor-t" x="392" y="206" text-anchor="end">heat shield <tspan class="t-mono">51482494848</tspan></text>
<line class="ln-thin" x1="335.2" y1="210" x2="335.2" y2="279"/>
<text class="t-sm fab-t" x="8" y="356">Plug welds at the factory spot-weld</text>
<text class="t-sm fab-t" x="8" y="370">positions; seal both faces</text>
<line class="ln-thin" x1="166.9" y1="345" x2="149.9" y2="277"/>
<text class="t-sm fab-t" x="392" y="356" text-anchor="end">Cut the bumper</text>
<text class="t-sm fab-t" x="392" y="370" text-anchor="end">for the tips</text>
<line class="ln-thin" x1="371.7" y1="345" x2="371.7" y2="340"/>
<line class="ln-faint" x1="8" y1="380" x2="392" y2="380"/>
<rect class="new" x="8" y="390" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="400.5">New BMW part</text>
<rect class="donor" x="132" y="390" width="12" height="12" rx="2"/>
<text class="t-sm" x="150" y="400.5">From the donor M3</text>
<rect class="fab" x="284" y="390" width="12" height="12" rx="2"/>
<text class="t-sm" x="302" y="400.5">Weld or cut</text>
</svg>
