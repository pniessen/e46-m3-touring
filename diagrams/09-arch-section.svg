<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" role="img" aria-label="Rear view section through the right rear arch at 0.9 pixels per millimetre. Your Touring's rear hub face and the M3's sit in the same place. A 325i wheel (8J ET47) puts its outer rim edge 54.6 mm outboard of the hub face; the M3 Style 67 rear wheel (9J ET26) puts it 88.3 mm out, with the wheel centreline 21 mm further out. The wider tire passes the Touring's original arch lip, so the new M3 outer skin sits about 25 to 30 mm further out and a fill strip extends the inner arch to meet it." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="396" fill="#ffffff"/>

<text class="t-xs" x="8" y="14">← inboard</text>
<text class="t-xs" x="392" y="14" text-anchor="end">outboard →</text>

<!-- Inner wheelhouse (yours) -->
<path class="keep-s" d="M250,120 V104 Q250,90 234,88 H30" stroke-width="2.5"/>
<text class="t-xs" x="34" y="80">inner wheelhouse</text>

<!-- Original Touring outer skin and lip -->
<path class="keep-s dash" d="M260,30 V120 H250" stroke-width="2.5"/>

<!-- New M3 outer skin, lip and fill strip -->
<path class="fab-s" d="M260,30 V46 C260,62 286,60 286,78 V120 H276" stroke-width="2.5"/>
<rect class="fab" x="250" y="117" width="26" height="6" stroke-width="1.5"/>

<!-- Flare offset -->
<line class="ln" x1="260" y1="24" x2="286" y2="24" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="t-sm fab-t t-b" x="292" y="28">≈ 25–30 mm</text>

<!-- 325i wheel and tire (8J ET47, 225 section), dashed -->
<rect class="keep-s dash" x="37.5" y="146" width="202.5" height="200" rx="22" stroke-width="2"/>
<rect class="keep-s dash" x="47.3" y="216" width="182.9" height="130" stroke-width="1.5"/>

<!-- M3 wheel and tire (Style 67 rear, 9J ET26, 255 section) -->
<rect class="ln" x="42.9" y="140" width="229.5" height="206" rx="24" style="stroke-width:2.5"/>
<rect class="donor" x="54.7" y="210" width="205.7" height="136" stroke-width="1.5" opacity="0.55"/>

<!-- Shared hub face -->
<line class="ln" x1="181" y1="200" x2="181" y2="380" style="stroke-width:2.5"/>
<text class="t-xs t-b" x="186" y="392">hub face: same on both</text>

<!-- Wheel centrelines and the 21 mm shift -->
<line class="keep-s dash" x1="138.7" y1="226" x2="138.7" y2="284" stroke-width="1.5"/>
<line class="donor-s dash" x1="157.6" y1="226" x2="157.6" y2="284" stroke-width="1.5"/>
<line class="ln" x1="138.7" y1="240" x2="157.6" y2="240" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="t-xs t-b" x="133" y="236" text-anchor="end">ET47 → ET26:</text>
<text class="t-xs t-b" x="133" y="248" text-anchor="end">21 mm out</text>

<!-- Outer rim edge offsets from the hub face -->
<line class="keep-s" x1="181" y1="300" x2="230.2" y2="300" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="t-xs t-b" x="176" y="304" text-anchor="end">325i rim edge: 54.6 mm</text>
<line class="ln" x1="181" y1="330" x2="260.4" y2="330" marker-end="url(#ah)"/>
<text class="t-xs t-b" x="176" y="334" text-anchor="end">M3 rim edge: 88.3 mm</text>

<!-- Labels -->
<g class="ln-thin">
  <path d="M302,70 L287,74"/>
  <path d="M302,104 L261,104"/>
  <path d="M302,146 L270,123"/>
  <path d="M302,196 L274,196"/>
</g>
<text class="t fab-t" x="306" y="66">New M3</text>
<text class="t fab-t" x="306" y="82">outer skin</text>
<text class="t" x="306" y="104">Old lip</text>
<text class="t fab-t" x="306" y="146">Fill strip</text>
<text class="t fab-t" x="306" y="162">extends the</text>
<text class="t fab-t" x="306" y="178">inner arch</text>
<text class="t" x="306" y="200">M3 tire passes</text>
<text class="t" x="306" y="216">the old lip</text>
<text class="t-sm" x="306" y="250">Solid: M3</text>
<text class="t-sm" x="306" y="266">255/40R18</text>
<text class="t-sm" x="306" y="286">Dashed: 325i</text>
<text class="t-sm" x="306" y="302">225/45R17</text>
</svg>
