<line class="ln" x1="108.5" y1="273" x2="108.5" y2="283" stroke-width="2"/>
<line class="ln" x1="159.5" y1="273" x2="159.5" y2="283" stroke-width="2"/>
<line class="ln" x1="164.5" y1="273" x2="164.5" y2="283" stroke-width="2"/>
<text class="t-xs" x="118" y="294" text-anchor="middle">return</text>
<line class="donor-s dash" x1="258" y1="290" x2="315" y2="290" stroke-width="1.8"/>
<text class="t-xs" x="287" y="272" text-anchor="middle">vacuum</text>
