<text class="t-xs" x="114" y="90" text-anchor="middle">pipe set</text>
<text class="t-xs" x="146" y="116" text-anchor="middle">rear feed</text>
<line class="ln" x1="170" y1="128" x2="100" y2="128"/>
<path class="fill-fg" d="M92,128 L101,123.5 L101,132.5 Z"/>
<line class="ln" x1="103.5" y1="123" x2="103.5" y2="133" stroke-width="2"/>
<line class="ln" x1="108.5" y1="123" x2="108.5" y2="133" stroke-width="2"/>
<line class="ln" x1="159.5" y1="123" x2="159.5" y2="133" stroke-width="2"/>
