<text class="t-sm" x="25" y="16.5">From donor M3</text>
<rect class="keep" x="121.8" y="6" width="12" height="12" rx="5" stroke-width="1"/>
<text class="t-sm" x="138.8" y="16.5">Keep yours</text>
