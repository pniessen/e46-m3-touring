<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 468" role="img" aria-label="Fuel system before and after the swap. Today your 325i's pump feeds a clamped pipe set and plain lines joined by hoses and clamps, to a one-piece filter-regulator that holds 3.5 bar and whose hose is a vent, not a vacuum reference. After the swap, route A, recommended: your tank stays and takes the donor's in-tank set (pump, baffle, jet pump and left sender). The M3 pipe set 16112283288 is pushed onto the pump and ends in a quick-connector for the M3 rear feed; the feed path to the M3 filter-regulator, a new filter on the donor's housing and regulator, and on to the S54 rail is all quick-connectors, and the return is hose and clamps. The regulator holds 5.0 bar and takes a vacuum hose to the S54's idle-air pipe; the rail has no test port, so the gauge goes on the regulator housing's threaded test fitting, TP1, and for the delivery test T3 the return line comes off at the housing into a container. The M3 front purge line runs from your canister's line to the S54 purge valve. Fallback, route C: keep your own pump only if it delivers 1.3 L or more in 30 s at 5 bar, and accept an adapter nobody has documented, either from its pipe set to the M3 rear feed or from your rear feed to the M3 filter; route B fits the donor's whole tank." color="#1b2128">
<style>
