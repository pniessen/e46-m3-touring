<!-- Fallback: route C -->
<rect class="warn-f" x="8" y="384" width="384" height="76" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="18" y="400">Route C, the fallback: your own pump</text>
<text class="t-xs" x="18" y="414">Only if it delivers 1.3 L or more in 30 s at 5 bar (T3, our margin),</text>
<text class="t-xs" x="18" y="426.5">and with an adapter nobody has documented: your pipe set to the M3</text>
<text class="t-xs" x="18" y="439">rear feed, or your rear feed to the M3 filter. Route B fits the donor's</text>
<text class="t-xs" x="18" y="451.5">whole tank instead, with the same pipe set and lines.</text>
</svg>
