<line class="ln" x1="297.5" y1="95" x2="297.5" y2="105" stroke-width="2"/>
<line class="ln" x1="302.5" y1="95" x2="302.5" y2="105" stroke-width="2"/>
<text class="t-xs" x="283" y="90" text-anchor="middle">front feed</text>
<line class="ln-thin" x1="214" y1="88" x2="214" y2="72"/>
<text class="t-xs" x="220" y="76">vent, not a vacuum reference</text>
<text class="t t-b t-mono" x="214" y="158" text-anchor="middle">3.5 bar</text>
<text class="t-xs" x="8" y="158">Pipe set 16117175998: clamped</text>
<text class="t-xs" x="316" y="158">test fitting,</text>
<text class="t-xs" x="316" y="170">if yours has one</text>
<line class="ln-faint" x1="8" y1="184" x2="392" y2="184"/>

<!-- After the swap: route A -->
<text class="t-h" x="8" y="208">AFTER: ROUTE A (RECOMMENDED)</text>
<rect class="keep" x="8" y="232" width="84" height="104" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="50" y="251" text-anchor="middle">Your tank</text>
<rect class="donor" x="14" y="260" width="72" height="70" rx="5" stroke-width="1.2"/>
<text class="t-xs t-b" x="50" y="274" text-anchor="middle">Donor's</text>
