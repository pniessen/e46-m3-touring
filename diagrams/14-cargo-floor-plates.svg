<text class="t-sm fab-t" x="214" y="380">Front mounts, under the seat:</text>
<text class="t-sm fab-t" x="214" y="394">cut in, weld the tops, patch</text>
<text class="t-sm" x="214" y="416">No partition wall behind the</text>
<text class="t-sm" x="214" y="430">seat: some kit parts won't fit</text>
<text class="t-sm fab-t" x="214" y="452">Rail flange: stitch failed spot</text>
<text class="t-sm fab-t" x="214" y="466">welds, then fit rail plates</text>
<text class="t-sm crit-t" x="214" y="488">Keep the flanges: drill out the</text>
<text class="t-sm crit-t" x="214" y="502">spot welds along the seam,</text>
<text class="t-sm crit-t" x="214" y="516">both rails and the rear panel</text>
<text class="t-sm fab-t" x="214" y="534">Rear mounts: through the</text>
<text class="t-sm fab-t" x="214" y="548">opening, weld the three</text>
<text class="t-sm fab-t" x="214" y="562">rosette welds on top</text>
<text class="t-sm" x="214" y="580">CMP's 120 mm (5 in): the strip</text>
<text class="t-sm" x="214" y="594">CMP cuts away to reach the</text>
<text class="t-sm" x="214" y="608">mount tops. It comes out too</text>

<!-- Touring note -->
<rect class="warn-f" x="8" y="636" width="384" height="58" rx="5"/>
<text class="t-sm fill-fg" x="18" y="655">No kit maker publishes Touring-specific cargo-side plates.</text>
<text class="t-sm fill-fg" x="18" y="670">The steel is the sedan's, so sedan-pattern plates should</text>
<text class="t-sm fill-fg" x="18" y="685">land in the same places: dry-fit and trace before you cut.</text>

<!-- Key -->
<rect class="fab" x="8" y="706" width="12" height="12" rx="2"/>
<text class="t-sm" x="26" y="716.5">Phase 5: cut, weld, fit</text>
