<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 742" role="img" aria-label="Two plan views of the Touring's rear floor around the rear subframe mounts, front of the car at the top, schematic and not to scale. From below, with the fuel tank, exhaust and subframe out: one reinforcement plate is plug-welded under each of the four subframe mounts, a V-brace mounting box is welded in on each side where the Touring has a grommet, the M3 push rod and V-brace bolt on later, and both diagonals between the mounts are measured before welding and after each session. From the cargo side, with the seat and trim out: the front-mount top welds are reached by cutting in under the rear seat and patching; the Touring has no partition wall behind the seat, so some kit parts won't fit; failed spot welds along the rail flanges are stitched and rail plates fitted. The floor behind the RACP seam, spare-wheel well included, is separated by drilling out its spot welds along the RACP seam, both rails and the rear panel, so those flanges stay whole, and it drops out downward; the three rosette welds on each rear mount are then welded through the opening. CMP's 120 mm (5 in) is the strip of the well beside each rail that CMP cuts away to reach the mount tops, so it comes out with the well; it is not a zone to avoid. No kit maker publishes Touring-specific cargo-side plates, so sedan-pattern plates are dry-fitted and traced before cutting." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
