    <circle cx="44" cy="183" r="2"/><circle cx="168" cy="183" r="2"/>
  </g>

  <!-- V-brace mounting boxes -->
  <g class="fab" stroke-width="1.5">
    <rect x="31" y="55" width="16" height="14" rx="2"/>
    <rect x="165" y="55" width="16" height="14" rx="2"/>
  </g>
  <circle class="fill-fg" cx="39" cy="62" r="1.8"/><circle class="fill-fg" cx="173" cy="62" r="1.8"/>

  <!-- Labels -->
  <g class="ln-thin">
    <path d="M212 62 L182 62"/>
    <path d="M212 91 L154 72"/>
    <path d="M212 140 L126 123"/>
    <path d="M212 178 L186 184"/>
    <path d="M212 230 L172 187"/>
  </g>
  <text class="t-sm fab-t" x="214" y="58">V-brace box each side, where</text>
  <text class="t-sm fab-t" x="214" y="72">your Touring has a grommet</text>
  <text class="t-sm donor-t" x="214" y="87">M3 push rod and V-brace</text>
  <text class="t-sm donor-t" x="214" y="101">bolt on later; spacer plates</text>
  <text class="t-sm donor-t" x="214" y="115">go under the push rod</text>
  <text class="t-sm" x="214" y="138">Measure both diagonals before</text>
  <text class="t-sm" x="214" y="152">welding and after each session</text>
  <text class="t-sm fab-t" x="214" y="174">A plate under each of the four</text>
  <text class="t-sm fab-t" x="214" y="188">subframe mounts: plug welds,</text>
  <text class="t-sm fab-t" x="214" y="202">then short stitches</text>
  <text class="t-sm" x="214" y="228">Rear mounts sit at the front</text>
  <text class="t-sm" x="214" y="242">corners of the well</text>


<line class="ln-faint" x1="8" y1="300" x2="392" y2="300"/>

