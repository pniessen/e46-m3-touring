<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 816" role="img" aria-label="Fuel-pump control, two ways. Recommended: keep the relay. The M3 DME's X60004 pin 10, called not used on US M3 drawings though builders report it works, grounds the coil of your relay K96 at socket X10156 pin 4 through the 0.35 SW/VI wire. K96 pin 8 takes the coil supply from F3 through X6021 pin 2 (1.5 RT/WS), live only while the DME relay is on; pin 6 takes the load supply from F54, 15 A (2.5 RT/VI); pin 2 feeds the pump in the tank (1.5 WS/BL). The DME's 0–120 Hz PWM output, X60002 pin 11, leaves the M3 harness at X6021 pin 1 (0.35 SW/VI); on a manual 325i your side of that pin is empty, so it connects to nothing; never put it on K96; both it and the pin-10 wire are 0.35 SW/VI, so go by the cavity, and a meter from the M3 harness's X6021 pin 1 to every K96 socket terminal must read open, or de-pin the M3 wire and insulate it. Prove pin 10 with one prime at key-on, STAT_EKP_EIN at 1 during it, and STEUERN_EKP clicking K96; if the job returns OKAY but K96 stays silent, go by the prime and STAT_EKP_EIN. Whether US software drops the pin-10 output after a crash isn't documented. Expect stored fault location 1 (0x01), Relais Kraftstoffpumpe, which INPA shows as 1; it shows in INPA, ISTA and PA-Soft but not on a generic scanner, and doesn't light the check-engine lamp; it is not 130 (0x82), the immobilizer fault; don't flash Euro software to clear it. Optional: the US M3's EKP pump module, plug X10157, takes the pin-11 signal on its pin 1 through X6021 pin 1, which needs a new terminal and wire on your side, F3 on pin 8, F54 on pin 6, feeds the pump from pin 2 (2.5 RT/WS) and is grounded on pin 7 (2.5 BR); pin 10 is then not used. There is no crash wire: the airbag unit's message goes over the K-bus to the cluster and over CAN to the DME, which switches the pump off. Fit it only if your state won't accept the stored fault or you want the slow-running pump and crash cut-off back; nobody has documented it in a Touring." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="816" fill="#ffffff"/>
<!-- Key -->
<rect class="donor" x="8" y="6" width="12" height="12" rx="5" stroke-width="1"/>
<text class="t-sm" x="25" y="16.5">From donor M3</text>
<rect class="keep" x="130" y="6" width="12" height="12" rx="5" stroke-width="1"/>
<text class="t-sm" x="147" y="16.5">Keep</text>
<rect class="new" x="196" y="6" width="12" height="12" rx="5" stroke-width="1"/>
<text class="t-sm" x="213" y="16.5">New</text>

<!-- Recommended: the MSS54's pin-10 output drives your K96 -->
<text class="t-h" x="8" y="44">RECOMMENDED: KEEP THE RELAY</text>
<rect class="donor" x="8" y="100" width="144" height="126" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="119">M3 DME</text>
<text class="t-sm" x="16" y="135">MSS54 / HP</text>
<text class="t-sm t-b t-mono" x="16" y="158">X60004 pin 10</text>
<text class="t-xs" x="16" y="171">"not used" on US drawings</text>
<text class="t-xs" x="16" y="183">(builders report it works)</text>
<text class="t-sm t-b t-mono" x="16" y="204">X60002 pin 11</text>
<text class="t-xs" x="16" y="217">0–120 Hz PWM</text>
<rect class="keep" x="232" y="120" width="108" height="80" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="292" y="146" text-anchor="middle">Relay K96</text>
<text class="t-xs" x="292" y="161" text-anchor="middle">socket <tspan class="t-mono">X10156</tspan></text>
<text class="t-xs" x="292" y="174" text-anchor="middle">behind the</text>
<text class="t-xs" x="292" y="186" text-anchor="middle">glovebox</text>
<rect class="shape" x="222" y="145" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="232" y="158.5" text-anchor="middle">4</text>
<line class="ln" x1="152" y1="154" x2="221" y2="154"/>
<text class="t-xs" x="186.5" y="148" text-anchor="middle"><tspan class="t-mono">0.35 SW/VI</tspan></text>
<rect class="shape" x="250" y="111" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="260" y="124.5" text-anchor="middle">8</text>
<rect class="shape" x="302" y="111" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="312" y="124.5" text-anchor="middle">6</text>
<line class="ln" x1="260" y1="62" x2="260" y2="110" marker-end="url(#ah)"/>
<text class="t-xs" x="254" y="68" text-anchor="end">F3 via <tspan class="t-mono">X6021</tspan> pin <tspan class="t-mono">2</tspan></text>
<text class="t-xs" x="254" y="80" text-anchor="end"><tspan class="t-mono">1.5 RT/WS</tspan></text>
<text class="t-xs" x="254" y="92" text-anchor="end">live only while the DME relay is on</text>
<line class="ln" x1="312" y1="62" x2="312" y2="110" marker-end="url(#ah)"/>
<text class="t-xs" x="318" y="68">F54, 15 A</text>
<text class="t-xs" x="318" y="80"><tspan class="t-mono">2.5 RT/VI</tspan></text>
<rect class="shape" x="280" y="191" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="290" y="204.5" text-anchor="middle">2</text>
<line class="ln" x1="290" y1="209" x2="290" y2="237" marker-end="url(#ah)"/>
<text class="t-xs" x="296" y="226"><tspan class="t-mono">1.5 WS/BL</tspan></text>
<rect class="keep" x="248" y="238" width="84" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="290" y="255" text-anchor="middle">Pump</text>
<text class="t-xs" x="290" y="268" text-anchor="middle">in the tank</text>

<!-- Pin 11, the PWM output: ends at X6021 pin 1, never on K96 -->
<line class="ln" x1="152" y1="200" x2="166" y2="200"/>
<rect class="donor" x="166" y="191" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="176" y="204.5" text-anchor="middle">1</text>
<rect class="keep dash" x="186" y="191" width="20" height="18" rx="2" stroke-width="1.2"/>
<line class="crit-s dash" x1="196" y1="190.5" x2="196" y2="159" stroke-width="1.5"/>
<path class="crit-s" d="M191,172.0 l10,10 M191,182.0 l10,-10" stroke-width="2"/>
<text class="t-xs crit-t t-b" x="187" y="181" text-anchor="end">never</text>
<text class="t-xs" x="158" y="222"><tspan class="t-mono">X6021</tspan> pin <tspan class="t-mono">1</tspan>:</text>
<text class="t-xs" x="158" y="234">your side empty</text>

<!-- Crash cut-off with the relay: undocumented -->
<text class="t-xs" x="8" y="256">Whether US software drops the pin-10</text>
<text class="t-xs" x="8" y="268.5">output after a crash isn't documented.</text>

<!-- How to prove pin 10 -->
<text class="t-xs" x="8" y="294">Prove pin 10 on the car: one prime at key-on, <tspan class="t-mono">STAT_EKP_EIN</tspan> = 1 during it, and</text>
<text class="t-xs" x="8" y="306.5"><tspan class="t-mono">STEUERN_EKP</tspan> makes K96 click. If the job returns OKAY but K96 stays silent,</text>
<text class="t-xs" x="8" y="319">go by the prime and <tspan class="t-mono">STAT_EKP_EIN</tspan>.</text>

<!-- The stored fault -->
<rect class="warn-f" x="8" y="330" width="384" height="78" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="18" y="347">Pin 11 connected to nothing: stored fault <tspan class="t-mono">1 (0x01)</tspan></text>
<text class="t-xs" x="18" y="362">"Relais Kraftstoffpumpe" (INPA shows 1): in INPA, ISTA and PA-Soft, not on</text>
<text class="t-xs" x="18" y="374.5">a generic scanner; it doesn't light the check-engine lamp. Not <tspan class="t-mono">130 (0x82)</tspan>,</text>
<text class="t-xs" x="18" y="387">the immobilizer fault. Don't flash Euro software to clear it: that drops the</text>
<text class="t-xs" x="18" y="399.5">DM-TL leak test.</text>

<!-- Never -->
<rect class="crit-s" x="8" y="416" width="384" height="92" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b crit-t" x="18" y="433">Never connect the PWM pump output to K96</text>
<text class="t-xs" x="18" y="448">A relay coil can't follow a 0–120 Hz signal and would likely chatter. The</text>
<text class="t-xs" x="18" y="460.5">wire leaves the M3 harness at <tspan class="t-mono">X6021</tspan> pin <tspan class="t-mono">1</tspan> (<tspan class="t-mono">0.35 SW/VI</tspan>, the same color as</text>
<text class="t-xs" x="18" y="473">the pin-10 wire: go by the cavity); your side of that pin is empty on a</text>
<text class="t-xs" x="18" y="485.5">manual 325i. Meter: M3 harness <tspan class="t-mono">X6021</tspan> pin <tspan class="t-mono">1</tspan> to every K96 socket terminal</text>
<text class="t-xs" x="18" y="498">reads open; any continuity → de-pin the M3 wire and insulate it.</text>

<line class="ln-faint" x1="8" y1="522" x2="392" y2="522"/>

<!-- Optional: the US M3's pump module, driven by pin 11 -->
<text class="t-h" x="8" y="546">OPTIONAL: THE M3 PUMP MODULE (EKP)</text>
<rect class="donor" x="8" y="560" width="144" height="104" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="16" y="579">M3 DME</text>
<text class="t-sm" x="16" y="595">MSS54 / HP</text>
<text class="t-sm t-b t-mono" x="16" y="618">X60004 pin 10</text>
<text class="t-xs" x="16" y="631">relay output</text>
<text class="t-sm t-b t-mono" x="16" y="646">X60002 pin 11</text>
<text class="t-xs" x="16" y="659">0–120 Hz PWM</text>
<line class="ln" x1="152" y1="614" x2="176" y2="614"/>
<circle class="shape" cx="180" cy="614" r="3.5"/>
<text class="t-xs" x="188" y="617.7">not used</text>
<rect class="donor" x="252" y="584" width="110" height="78" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="313" y="607" text-anchor="middle">EKP module</text>
<text class="t-xs" x="313" y="621" text-anchor="middle">plug <tspan class="t-mono">X10157</tspan></text>
<text class="t-xs" x="313" y="634" text-anchor="middle">slows the pump at</text>
<text class="t-xs" x="313" y="646" text-anchor="middle">idle and part load</text>
<line class="ln" x1="152" y1="642" x2="166" y2="642"/>
<rect class="donor" x="166" y="633" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="176" y="646.5" text-anchor="middle">1</text>
<rect class="new" x="186" y="633" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="196" y="646.5" text-anchor="middle">1</text>
<rect class="shape" x="242" y="633" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="252" y="646.5" text-anchor="middle">1</text>
<line class="new-s" x1="206" y1="642" x2="242" y2="642" stroke-width="2"/>
<text class="t-xs new-t" x="158" y="664">new terminal and</text>
<text class="t-xs new-t" x="158" y="676">wire on your side</text>
<rect class="shape" x="270" y="575" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="280" y="588.5" text-anchor="middle">8</text>
<rect class="shape" x="328" y="575" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="338" y="588.5" text-anchor="middle">6</text>
<line class="ln" x1="280" y1="560" x2="280" y2="574" marker-end="url(#ah)"/>
<text class="t-xs" x="274" y="566" text-anchor="end">F3</text>
<line class="ln" x1="338" y1="560" x2="338" y2="574" marker-end="url(#ah)"/>
<text class="t-xs" x="344" y="566">F54</text>
<rect class="shape" x="276" y="653" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="286" y="666.5" text-anchor="middle">2</text>
<line class="ln" x1="286" y1="671" x2="286" y2="693" marker-end="url(#ah)"/>
<text class="t-xs" x="277" y="689" text-anchor="end"><tspan class="t-mono">2.5 RT/WS</tspan></text>
<rect class="keep" x="244" y="694" width="84" height="36" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="286" y="711" text-anchor="middle">Pump</text>
<text class="t-xs" x="286" y="724" text-anchor="middle">in the tank</text>
<rect class="shape" x="332" y="653" width="20" height="18" rx="2" stroke-width="1.2"/>
<text class="t t-mono" x="342" y="666.5" text-anchor="middle">7</text>
<line class="ln" x1="342" y1="671" x2="342" y2="692"/>
<path class="ln" d="M332,692 H352 M336,697 H348 M340,702 H344"/>
<text class="t-xs" x="348" y="686"><tspan class="t-mono">2.5 BR</tspan></text>

<!-- Crash cut-off: no wire; airbag unit, K-bus, cluster, CAN, DME -->
<rect class="keep" x="8" y="692" width="76" height="28" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="46" y="710.5" text-anchor="middle">Cluster</text>
<line class="ln" x1="46" y1="691" x2="46" y2="665" marker-end="url(#ah)"/>
<text class="t-xs" x="52" y="684">CAN</text>
<rect class="keep" x="118" y="692" width="92" height="28" rx="5" stroke-width="1.5"/>
<text class="t t-b" x="164" y="710.5" text-anchor="middle">Airbag unit</text>
<line class="ln" x1="117" y1="706" x2="85" y2="706" marker-end="url(#ah)"/>
<text class="t-xs" x="101" y="697" text-anchor="middle">K-bus</text>
<text class="t-xs" x="8" y="746">No wire: after a crash, the airbag unit's message reaches the DME through</text>
<text class="t-xs" x="8" y="758.5">the cluster, and the DME switches the pump off.</text>

<!-- When to fit it -->
<text class="t-xs" x="8" y="782">Fit it only if your state won't accept the stored fault, or you want the</text>
<text class="t-xs" x="8" y="794.5">slow-running pump and crash cut-off back. It needs five wires to the</text>
<text class="t-xs" x="8" y="807">relay's four, and nobody has documented it in a Touring.</text>
</svg>
