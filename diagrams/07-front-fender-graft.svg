<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 284" role="img" aria-label="Left side view of the front fender. The front part, with the flared arch, the gill and the headlight edge, comes from the M3 fender. A strip of your 4-door fender stays at the rear, carrying the door gap, the A-pillar flange and the top mounting rail. The graft line runs vertically a few inches ahead of the door gap." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<rect class="bg" x="0" y="0" width="400" height="284" fill="#ffffff"/>

<text class="t-xs" x="8" y="276">← front</text>

<!-- Door and A-pillar (keep) -->
<path class="shape" d="M300,90 H392 V228 H300 Z"/>
<path class="ln" d="M300,90 L326,60"/>
<text class="t-sm" x="346" y="164" text-anchor="middle">front door</text>

<!-- Strip of the 4-door fender that stays -->
<path class="keep" d="M262,91 L296,90 L296,228 L262,228 Z" stroke-width="1.5"/>

<!-- M3 fender front section -->
<path class="donor" d="M40,99 L262,91 L262,228 L210,228 L204,214 A64,64 0 0 0 76,214 L62,214 Q42,212 38,172 Z" stroke-width="1.5"/>
<path class="donor-f" d="M41,101 L84,99 L82,118 Q60,124 42,124 Z" opacity="0.55"/>
<path class="donor-s" d="M206,214 A66,66 0 0 0 74,214" stroke-width="5"/>
<rect class="donor" x="220" y="120" width="30" height="34" rx="5" stroke-width="1.5"/>
<path class="donor-s" d="M226,129 H244 M226,137 H244 M226,145 H244" stroke-width="2"/>

<!-- Wheel -->
<circle class="ln" cx="140" cy="214" r="50"/>
<circle class="fill-fg" cx="140" cy="214" r="6"/>

<!-- Graft line -->
<path class="fab-s dash" d="M262,84 V236" stroke-width="2.5"/>

<!-- Labels -->
<g class="ln-thin">
  <path d="M72,60 L120,150"/>
  <path d="M330,64 L280,140"/>
  <path d="M262,246 L262,238"/>
</g>
<text class="t donor-t" x="8" y="38">M3 fender: flared arch,</text>
<text class="t donor-t" x="8" y="54">gill, headlight edge</text>
<text class="t" x="392" y="22" text-anchor="end">Keep this strip:</text>
<text class="t" x="392" y="38" text-anchor="end">door gap, A-pillar</text>
<text class="t" x="392" y="54" text-anchor="end">flange, top rail</text>
<text class="t fab-t" x="262" y="260" text-anchor="middle">Graft line, a few inches</text>
<text class="t fab-t" x="262" y="276" text-anchor="middle">ahead of the door gap</text>
</svg>
