<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-label="The electric fan before and after the swap, seen from above with the front at the top. Your manual 325i Touring as built has no viscous fan, since ETK lists it for automatics only; its fan is a 390 W electric fan, 17117561757, inside the radiator shroud, with its power stage and plug X82 on the shroud. A manual Touring almost certainly has no pusher fan in front of the condenser: ETK lists one, 64546988913, with no gearbox note, but the DME has only one fan output and owners call it the automatic's part; check your car in Phase 0. After the swap the car has both M3 fans: the electric pusher fan 64546988914 in front of the condenser, with its power stage on the fan, and the viscous fan 11521712058 in the M3 shroud on coupling 11527831619 on the water pump, rated on at 92 °C and off at 60 °C, with no wiring and a left-hand thread at 40 Nm. The condenser is the same part on both cars. In both cars the DME drives the fan from X60004 pin 4 over the 0.5 SW/GN wire to X82 pin 2, F37 (50 A) feeds pin 4 over 6.0 RT/BL, and pin 1 is ground over 6.0 BR, so no pin moves; X82's lead is extended or re-routed only if it doesn't reach the pusher fan (one manual-Touring swap plugged straight in), keeping the pins, with pins 1 and 4 in 6.0 square millimetres and pin 2 in 0.5. Compare the plugs first: WDS calls X82 a 4-pin plug with pins 1, 2 and 4 used, while ETK lists a 3-pole housing, 61138380380, for both cars' pusher fans." color="#1b2128">
<style>
svg{color:#1b2128;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}
text{fill:currentColor}
.t{font-size:13px}.t-sm{font-size:11.5px;fill:#55606c}.t-xs{font-size:10.5px;fill:#55606c}
.t-b{font-weight:600}.t-h{font-size:13px;font-weight:700;letter-spacing:.08em}
.t-mono{font-family:"IBM Plex Mono",Menlo,monospace}
.ln{stroke:currentColor;fill:none;stroke-width:1.5}.ln-thin{stroke:#8a95a1;fill:none;stroke-width:1}.ln-faint{stroke:#d2d9e0;fill:none;stroke-width:1}
.dash{stroke-dasharray:5 4}.fill-fg{fill:currentColor}.fill-bg{fill:#fff}
.shape{fill:#fff;stroke:currentColor;stroke-width:1.5}.panel{fill:#eef2f6;stroke:#d2d9e0}
.donor{fill:#dce8f6;stroke:#1d5fa6}.new{fill:#dff0e6;stroke:#1f6e45}.fab{fill:#fbe5d9;stroke:#b9440f}.keep{fill:#e9edf1;stroke:#66727e}
.donor-s{stroke:#1d5fa6;fill:none}.new-s{stroke:#1f6e45;fill:none}.fab-s{stroke:#b9440f;fill:none}.keep-s{stroke:#66727e;fill:none}.crit-s{stroke:#ad2a22;fill:none}
.donor-t{fill:#1d5fa6}.new-t{fill:#1f6e45}.fab-t{fill:#b9440f}.crit-t{fill:#ad2a22}
.donor-f{fill:#1d5fa6}.new-f{fill:#1f6e45}.fab-f{fill:#b9440f}.crit-f{fill:#ad2a22}.keep-f{fill:#66727e}
.warn-f{fill:#fff3cf;stroke:#e0a800}
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" class="fill-fg"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="400" height="900" fill="#ffffff"/>

<!-- Key -->
<rect class="keep" x="8" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="25" y="16.5">Keep</text>
<rect class="donor" x="65.9" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="82.9" y="16.5">From donor M3</text>
<rect class="fab" x="175.7" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="192.7" y="16.5">Extend or re-route</text>
<rect class="shape" x="301.5" y="6" width="12" height="12" rx="2" stroke-width="1"/>
<text class="t-sm" x="318.5" y="16.5">Comes out</text>

<!-- Panel 1: your manual Touring as built -->
<rect class="panel" x="6" y="28" width="388" height="408" rx="8" stroke-width="1"/>
<text class="t-h" x="16" y="50">YOUR TOURING AS BUILT (MANUAL)</text>
<text class="t-xs" x="16" y="65">Seen from above, front at the top</text>

<!-- Pusher fan: almost certainly none on a manual Touring -->
<rect class="ln-thin dash" x="60" y="86" width="120" height="18" rx="4"/>
<text class="t-sm t-b" x="120" y="99" text-anchor="middle">?</text>
<line class="ln-thin" x1="181" y1="95" x2="210" y2="95"/>
<text class="t-sm t-b" x="216" y="92">A pusher fan here too?</text>
<text class="t-xs" x="216" y="105">Almost certainly not: see below</text>

<!-- Condenser (keep, same part) -->
<rect class="keep" x="50" y="126" width="140" height="10" rx="2" stroke-width="1.5"/>
<line class="ln-thin" x1="191" y1="131" x2="210" y2="131"/>
<text class="t-sm t-b" x="216" y="130">Condenser</text>
<text class="t-xs" x="216" y="143">the same part on both cars</text>

<!-- Radiator -->
<rect class="shape" x="46" y="156" width="148" height="18" rx="2" stroke-width="1.5"/>
<line class="ln-thin" x1="195" y1="165" x2="210" y2="165"/>
<text class="t-sm t-b" x="216" y="169">Your radiator <tspan class="t-mono">17119071518</tspan></text>

<!-- Shroud and its fan -->
<path class="shape" d="M46,176 H194 L158,204 H82 Z" stroke-width="1.5"/>
<rect class="shape" x="86" y="195" width="68" height="6" rx="1" stroke-width="1.2"/>
<line class="ln-thin" x1="176" y1="190" x2="210" y2="190"/>
<text class="t-sm t-b" x="216" y="193">390 W electric fan</text>
<text class="t-xs" x="216" y="206"><tspan class="t-mono">17117561757</tspan>, in the radiator</text>
<text class="t-xs" x="216" y="218.5">shroud; its power stage and plug</text>
<text class="t-xs" x="216" y="231">X82 sit on the shroud</text>

<!-- Electric fan motor on the shroud; M54 engine with no viscous fan -->
<rect class="shape" x="111" y="201" width="18" height="12" rx="2" stroke-width="1.5"/>
<rect class="shape" x="84" y="226" width="72" height="36" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="120" y="248" text-anchor="middle">M54</text>
<line class="ln-thin" x1="157" y1="244" x2="210" y2="244"/>
<text class="t-sm t-b" x="216" y="248">No viscous fan</text>
<text class="t-xs" x="216" y="261">ETK lists it for automatics only</text>

<!-- X82 and its wires: no pin moves -->
<rect class="shape" x="22" y="183" width="18" height="14" rx="2" stroke-width="1.5"/>
<text class="t-xs t-b t-mono" x="31" y="178" text-anchor="middle">X82</text>
<line class="ln" x1="40" y1="190" x2="63" y2="190"/>
<line class="keep-s" x1="31" y1="198" x2="31" y2="338" stroke-width="3"/>
<line class="ln" x1="31" y1="286" x2="214" y2="286"/>
<text class="t-xs" x="42" y="281">pin <tspan class="t-mono t-b">2</tspan> · <tspan class="t-mono">0.5 SW/GN</tspan></text>
<line class="ln" x1="31" y1="312" x2="214" y2="312"/>
<text class="t-xs" x="42" y="307">pin <tspan class="t-mono t-b">4</tspan> · <tspan class="t-mono">6.0 RT/BL</tspan></text>
<line class="ln" x1="31" y1="338" x2="196" y2="338"/>
<text class="t-xs" x="42" y="333">pin <tspan class="t-mono t-b">1</tspan> · <tspan class="t-mono">6.0 BR</tspan></text>
<rect class="shape" x="214" y="275" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="222" y="290"><tspan class="t-b">Your DME</tspan>, <tspan class="t-mono">X60004</tspan> pin <tspan class="t-mono">4</tspan></text>
<rect class="keep" x="214" y="301" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="222" y="316"><tspan class="t-b t-mono">F37</tspan>, 50 A feed</text>
<path class="ln" d="M187,338 H205 M190.5,342.5 H201.5 M194,347 H198"/>
<text class="t-sm" x="214" y="342">ground</text>

<!-- The pusher fan on a manual Touring: almost certainly none -->
<rect class="warn-f" x="14" y="362" width="372" height="66" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="24" y="379">A manual Touring almost certainly has no pusher fan:</text>
<text class="t-xs" x="24" y="394">ETK lists one (64546988913) with no gearbox note, but the DME has only</text>
<text class="t-xs" x="24" y="406.5">one fan output and owners call it the automatic's part. Check your car</text>
<text class="t-xs" x="24" y="419">in Phase 0.</text>

<!-- Panel 2: after the swap -->
<rect class="panel" x="6" y="446" width="388" height="448" rx="8" stroke-width="1"/>
<text class="t-h" x="16" y="468">AFTER THE SWAP</text>
<text class="t-xs" x="16" y="483">Fit both M3 fans, as BMW did</text>

<!-- Pusher fan 64546988914 in front of the condenser (donor) -->
<rect class="donor" x="60" y="504" width="120" height="16" rx="4" stroke-width="1.5"/>
<circle class="donor" cx="120" cy="512" r="4" stroke-width="1.2"/>
<line class="ln-thin" x1="181" y1="512" x2="210" y2="512"/>
<text class="t-sm t-b" x="216" y="510">Pusher fan <tspan class="t-mono">64546988914</tspan></text>
<text class="t-xs" x="216" y="523">its power stage is on the fan</text>

<!-- Condenser (keep, same part) -->
<rect class="keep" x="50" y="544" width="140" height="10" rx="2" stroke-width="1.5"/>
<line class="ln-thin" x1="191" y1="549" x2="210" y2="549"/>
<text class="t-sm t-b" x="216" y="548">Condenser</text>
<text class="t-xs" x="216" y="561">the same part on both cars</text>

<!-- Radiator -->
<rect class="donor" x="46" y="574" width="148" height="18" rx="2" stroke-width="1.5"/>
<line class="ln-thin" x1="195" y1="583" x2="210" y2="583"/>
<text class="t-sm t-b" x="216" y="587">M3 radiator <tspan class="t-mono">17102228941</tspan></text>

<!-- Shroud and its fan -->
<path class="donor" d="M46,594 H194 L158,622 H82 Z" stroke-width="1.5"/>
<rect class="donor" x="86" y="613" width="68" height="6" rx="1" stroke-width="1.2"/>
<line class="ln-thin" x1="176" y1="608" x2="210" y2="608"/>
<text class="t-sm t-b" x="216" y="611">M3 shroud <tspan class="t-mono">17112228943</tspan></text>
<text class="t-xs" x="216" y="624">with the viscous fan <tspan class="t-mono">11521712058</tspan></text>

<!-- Viscous coupling 11527831619 on the S54's water pump (donor) -->
<rect class="donor" x="111" y="619" width="18" height="15" rx="2" stroke-width="1.5"/>
<rect class="donor" x="84" y="634" width="72" height="46" rx="4" stroke-width="1.5"/>
<text class="t-sm t-b" x="120" y="661" text-anchor="middle">S54</text>
<path class="ln-thin" d="M130,628 H198 L210,641"/>
<text class="t-sm t-b" x="216" y="645">Coupling <tspan class="t-mono">11527831619</tspan></text>
<text class="t-xs" x="216" y="658">on the water pump, rated on at</text>
<text class="t-xs" x="216" y="670.5">92 °C and off at 60 °C; no wiring.</text>
<text class="t-xs" x="216" y="683">Left-hand thread, 40 Nm</text>

<!-- X82 and its wires: no pin moves -->
<rect class="shape" x="22" y="505" width="18" height="14" rx="2" stroke-width="1.5"/>
<text class="t-xs t-b t-mono" x="31" y="500" text-anchor="middle">X82</text>
<line class="ln" x1="40" y1="512" x2="59" y2="512"/>
<line class="fab-s" x1="31" y1="520" x2="31" y2="608" stroke-width="3"/>
<line class="keep-s" x1="31" y1="608" x2="31" y2="756" stroke-width="3"/>
<line class="ln" x1="31" y1="704" x2="214" y2="704"/>
<text class="t-xs" x="42" y="699">pin <tspan class="t-mono t-b">2</tspan> · <tspan class="t-mono">0.5 SW/GN</tspan></text>
<line class="ln" x1="31" y1="730" x2="214" y2="730"/>
<text class="t-xs" x="42" y="725">pin <tspan class="t-mono t-b">4</tspan> · <tspan class="t-mono">6.0 RT/BL</tspan></text>
<line class="ln" x1="31" y1="756" x2="196" y2="756"/>
<text class="t-xs" x="42" y="751">pin <tspan class="t-mono t-b">1</tspan> · <tspan class="t-mono">6.0 BR</tspan></text>
<rect class="donor" x="214" y="693" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="222" y="708"><tspan class="t-b">M3 DME</tspan>, <tspan class="t-mono">X60004</tspan> pin <tspan class="t-mono">4</tspan></text>
<rect class="keep" x="214" y="719" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t-sm" x="222" y="734"><tspan class="t-b t-mono">F37</tspan>, 50 A feed</text>
<path class="ln" d="M187,756 H205 M190.5,760.5 H201.5 M194,765 H198"/>
<text class="t-sm" x="214" y="760">ground</text>
<text class="t-xs" x="16" y="784">No pin moves. The orange lead: extend or re-route X82 only if it doesn't</text>
<text class="t-xs" x="16" y="796.5">reach the pusher (one manual-Touring swap plugged straight in), keeping</text>
<text class="t-xs" x="16" y="809">the pins; extend pins 1 and 4 in 6.0 mm², pin 2 in 0.5 mm².</text>
<rect class="warn-f" x="14" y="820" width="372" height="66" rx="5" stroke-width="1.5"/>
<text class="t-sm t-b" x="24" y="837">Compare the plugs before you cut anything</text>
<text class="t-xs" x="24" y="852">WDS calls X82 a 4-pin plug with pins 1, 2 and 4 used. ETK lists a</text>
<text class="t-xs" x="24" y="864.5">3-pole housing (61138380380, terminal 61138380385) for both cars'</text>
<text class="t-xs" x="24" y="877">pusher fans, and no plug for the shroud fan.</text>
</svg>
